/* ══════════════════════════════════════
   MÉTRICAS DE ACCESO (sesiones)
   Cada acceso autenticado crea un doc en la colección `sessions`.
   La duración se estima con un "latido" (lastSeenAt) + cierre al salir.
   La IP se obtiene de un servicio público (api.ipify.org).
══════════════════════════════════════ */
async function startSession() {
  if (currentSessionId || _sessionStarting || !currentUser) return;
  _sessionStarting = true;
  let ip = null;
  try { ip = (await (await fetch('https://api.ipify.org?format=json')).json()).ip; } catch (e) {}
  try {
    const ref = await db.collection('sessions').add({
      uid: currentUser.uid,
      email: currentUser.email,
      role: (currentUserData && currentUserData.role) || 'user',
      ip: ip,
      userAgent: navigator.userAgent,
      startAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastSeenAt: firebase.firestore.FieldValue.serverTimestamp(),
      endAt: null,
      ended: false
    });
    currentSessionId = ref.id;
    startHeartbeat();
  } catch (e) { console.warn('No se pudo registrar la sesión:', e && e.message); }
  finally { _sessionStarting = false; }
}
// El latido solo suma tiempo mientras la pestaña está visible Y hubo actividad
// del usuario en los últimos IDLE_LIMIT_MS. Así, una pestaña dejada abierta sin
// uso deja de acumular tiempo (evita duraciones infladas). Al volver a
// interactuar, el latido se reanuda.
const HEARTBEAT_MS   = 60000;                // frecuencia del latido (1 min)
const IDLE_LIMIT_MS  = 5 * 60 * 1000;        // inactividad tras la cual se pausa el conteo
const MAX_SESSION_MS = 2 * 60 * 60 * 1000;   // tope de duración por sesión (saneo de métricas)
const SESSION_LIVE_MS = 2.5 * 60 * 1000;     // sin latido en este lapso ⇒ ya no cuenta como "en curso"

function markActivity() { _lastActivity = Date.now(); }
function bindActivity() {
  if (_activityBound) return;
  _activityBound = true;
  ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'].forEach(ev =>
    window.addEventListener(ev, markActivity, { passive: true }));
  // Interacción dentro del iframe del informe (dashboards instrumentados) también cuenta.
  window.addEventListener('message', markActivity);
}

function startHeartbeat() {
  stopHeartbeat();
  _lastActivity = Date.now();
  bindActivity();
  _hbTimer = setInterval(touchSession, HEARTBEAT_MS);
}
function stopHeartbeat() { if (_hbTimer) { clearInterval(_hbTimer); _hbTimer = null; } }
function touchSession() {
  if (!currentSessionId || document.visibilityState !== 'visible') return;
  if (Date.now() - _lastActivity > IDLE_LIMIT_MS) return;   // usuario inactivo → no sumamos tiempo
  db.collection('sessions').doc(currentSessionId)
    .update({ lastSeenAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => {});
}
async function endSession() {
  stopHeartbeat();
  const id = currentSessionId;
  currentSessionId = null;
  if (!id) return;
  try {
    await db.collection('sessions').doc(id).update({
      endAt: firebase.firestore.FieldValue.serverTimestamp(),
      lastSeenAt: firebase.firestore.FieldValue.serverTimestamp(),
      ended: true
    });
  } catch (e) {}
}
// Al ocultar la pestaña registramos el último "visto" (best-effort). No cerramos
// la sesión acá porque cambiar de pestaña no es cerrar sesión.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') touchSession();
});
// Al cerrar la pestaña o navegar fuera, cerramos la sesión (best-effort; si la
// escritura no llega a completarse, el umbral de latido igual la marca cerrada).
window.addEventListener('pagehide', () => { if (currentSessionId) endSession(); });

let _allSessions = [];   // sesiones cargadas para el panel de métricas

async function loadMetrics() {
  const sumEl = el('metrics-summary'), sesEl = el('metrics-sessions');
  if (!sumEl) return;
  sumEl.innerHTML = '<div class="loading">Cargando métricas...</div>';
  if (sesEl) sesEl.innerHTML = '';
  try {
    const snap = await db.collection('sessions').orderBy('startAt', 'desc').limit(500).get();
    _allSessions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    sumEl.innerHTML = emptyHTML('⚠️', 'No se pudieron cargar las métricas.<br>¿Publicaste las reglas de Firestore para <b>sessions</b>?');
    return;
  }
  if (!_allSessions.length) {
    sumEl.innerHTML = emptyHTML('📊', 'Todavía no hay accesos registrados.');
    if (sesEl) sesEl.innerHTML = '';
    return;
  }

  renderUserSummary();     // resumen por usuario (respeta su propio rango de fechas)
  renderSessionsTable();   // detalle de sesiones (respeta el rango de fechas)
}

// Renderiza el "Resumen por usuario" aplicando su propio filtro Desde/Hasta.
// La columna "IPs" lista TODAS las IPs distintas usadas en el rango (más
// reciente primero), en lugar de solo la última.
// ── Paginado de las tablas de métricas ──
const METRICS_PAGE = 20;
let _sumPage = 0, _sesPage = 0;
function pagerHTML(page, totalPages, totalItems, fn) {
  if (totalPages <= 1) return '';
  return `<div style="display:flex;align-items:center;justify-content:flex-end;gap:.6rem;padding:.7rem 1.25rem;font-size:.8rem;color:var(--gray);flex-wrap:wrap">
    <span>${totalItems} resultado${totalItems === 1 ? '' : 's'} · página ${page + 1} de ${totalPages}</span>
    <button class="btn btn-outline btn-sm" ${page <= 0 ? 'disabled' : ''} onclick="${fn}(-1)">‹ Anterior</button>
    <button class="btn btn-outline btn-sm" ${page >= totalPages - 1 ? 'disabled' : ''} onclick="${fn}(1)">Siguiente ›</button>
  </div>`;
}
function gotoSumPage(delta) { _sumPage += delta; renderUserSummary(); }
function gotoSesPage(delta) { _sesPage += delta; renderSessionsTable(); }

function renderUserSummary() {
  const sumEl = el('metrics-summary');
  if (!sumEl) return;

  const fromV = el('metrics-sum-from') && el('metrics-sum-from').value;
  const toV   = el('metrics-sum-to')   && el('metrics-sum-to').value;
  const from = fromV ? new Date(fromV + 'T00:00:00').getTime() : null;
  const to   = toV   ? new Date(toV   + 'T23:59:59').getTime() : null;
  const userF = (el('metrics-sum-user') && el('metrics-sum-user').value || '').trim().toLowerCase();

  let list = _allSessions;
  if (from) list = list.filter(s => tsMs(s.startAt) >= from);
  if (to)   list = list.filter(s => tsMs(s.startAt) <= to);

  const byUser = {};
  list.forEach(s => {
    const k = s.email || s.uid;
    if (!byUser[k]) byUser[k] = { email: k, count: 0, total: 0, last: 0, ips: {} };
    byUser[k].count++;
    byUser[k].total += sessionDuration(s);
    const st = tsMs(s.startAt);
    if (st && st > byUser[k].last) byUser[k].last = st;
    const ip = (s.ip || '').trim();
    if (ip && (!byUser[k].ips[ip] || st > byUser[k].ips[ip])) byUser[k].ips[ip] = st;
  });

  let rows = Object.values(byUser).sort((a, b) => b.last - a.last);
  if (userF) rows = rows.filter(u => String(u.email || '').toLowerCase().includes(userF));
  if (!rows.length) { sumEl.innerHTML = emptyHTML('🔎', 'No hay accesos que coincidan con los filtros.'); return; }

  const totalPages = Math.max(1, Math.ceil(rows.length / METRICS_PAGE));
  if (_sumPage >= totalPages) _sumPage = totalPages - 1;
  if (_sumPage < 0) _sumPage = 0;
  const pageRows = rows.slice(_sumPage * METRICS_PAGE, (_sumPage + 1) * METRICS_PAGE);

  sumEl.innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr><th>Usuario</th><th>Accesos</th><th>Tiempo total</th><th>Último acceso</th><th>IPs</th></tr></thead>
    <tbody>${pageRows.map(u => {
      const ips = Object.keys(u.ips).sort((a, b) => u.ips[b] - u.ips[a]);
      const ipsHtml = ips.length ? ips.map(esc).join('<br>') : '—';
      return `<tr>
        <td style="font-weight:600">${esc(u.email)}</td>
        <td>${u.count}</td>
        <td>${fmtDur(u.total)}</td>
        <td style="color:var(--gray)">${u.last ? fmtDateTime(u.last) : '—'}</td>
        <td style="color:var(--gray)">${ipsHtml}</td>
      </tr>`;
    }).join('')}</tbody></table></div>` + pagerHTML(_sumPage, totalPages, rows.length, 'gotoSumPage');
}

function clearSummaryFilter() {
  if (el('metrics-sum-from')) el('metrics-sum-from').value = '';
  if (el('metrics-sum-to'))   el('metrics-sum-to').value = '';
  if (el('metrics-sum-user')) el('metrics-sum-user').value = '';
  _sumPage = 0;
  renderUserSummary();
}

// Renderiza la tabla de sesiones recientes con filtros (fecha + usuario) y paginado de 20.
function renderSessionsTable() {
  const sesEl = el('metrics-sessions');
  if (!sesEl) return;
  const fromV = el('metrics-from') && el('metrics-from').value;
  const toV   = el('metrics-to') && el('metrics-to').value;
  const from = fromV ? new Date(fromV + 'T00:00:00').getTime() : null;
  const to   = toV   ? new Date(toV   + 'T23:59:59').getTime() : null;
  const userF = (el('metrics-ses-user') && el('metrics-ses-user').value || '').trim().toLowerCase();

  let list = _allSessions;
  if (from) list = list.filter(s => tsMs(s.startAt) >= from);
  if (to)   list = list.filter(s => tsMs(s.startAt) <= to);
  if (userF) list = list.filter(s => String(s.email || s.uid || '').toLowerCase().includes(userF));

  if (!list.length) { sesEl.innerHTML = emptyHTML('🔎', 'No hay sesiones que coincidan con los filtros.'); return; }

  const totalPages = Math.max(1, Math.ceil(list.length / METRICS_PAGE));
  if (_sesPage >= totalPages) _sesPage = totalPages - 1;
  if (_sesPage < 0) _sesPage = 0;
  const pageRows = list.slice(_sesPage * METRICS_PAGE, (_sesPage + 1) * METRICS_PAGE);

  sesEl.innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr><th>Usuario</th><th>Inicio</th><th>Duración</th><th>IP</th><th>Dispositivo</th></tr></thead>
    <tbody>${pageRows.map(s => `<tr>
      <td style="font-weight:600">${esc(s.email || s.uid)}</td>
      <td style="color:var(--gray)">${fmtDateTime(tsMs(s.startAt))}</td>
      <td>${sessionOpen(s) ? '<span style="color:var(--orange);font-weight:600">en curso</span>' : fmtDur(sessionDuration(s))}</td>
      <td style="color:var(--gray)">${esc(s.ip || '—')}</td>
      <td style="color:var(--gray);font-size:.72rem">${esc(shortUA(s.userAgent))}</td>
    </tr>`).join('')}</tbody></table></div>` + pagerHTML(_sesPage, totalPages, list.length, 'gotoSesPage');
}
function clearMetricsFilter() {
  if (el('metrics-from')) el('metrics-from').value = '';
  if (el('metrics-to'))   el('metrics-to').value = '';
  if (el('metrics-ses-user')) el('metrics-ses-user').value = '';
  _sesPage = 0;
  renderSessionsTable();
}

// Diálogo con los accesos de un usuario puntual (desde la pestaña Usuarios).
async function showUserAccess(uid, email) {
  openAccessModal(email, '<div class="loading">Cargando accesos...</div>');
  let sessions = [];
  try {
    const snap = await db.collection('sessions').where('uid', '==', uid).get();
    sessions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    sessions.sort((a, b) => tsMs(b.startAt) - tsMs(a.startAt));
  } catch (e) {
    setAccessModalBody(emptyHTML('⚠️', 'No se pudieron cargar los accesos.<br>¿Publicaste las reglas de Firestore para <b>sessions</b>?'));
    return;
  }
  if (!sessions.length) { setAccessModalBody(emptyHTML('📭', 'Este usuario todavía no registra accesos.')); return; }
  const total = sessions.reduce((a, s) => a + sessionDuration(s), 0);
  setAccessModalBody(`
    <p style="font-size:.8rem;color:var(--gray);font-weight:500;margin-bottom:.85rem">
      ${sessions.length} acceso(s) · tiempo total ${fmtDur(total)}
    </p>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Fecha</th><th>Hora</th><th>Duración</th><th>IP</th></tr></thead>
      <tbody>${sessions.map(s => {
        const ms = tsMs(s.startAt), d = ms ? new Date(ms) : null;
        return `<tr>
          <td>${d ? d.toLocaleDateString('es-UY', {day:'2-digit',month:'2-digit',year:'numeric'}) : '—'}</td>
          <td>${d ? d.toLocaleTimeString('es-UY', {hour:'2-digit',minute:'2-digit'}) : '—'}</td>
          <td>${sessionOpen(s) ? '<span style="color:var(--orange);font-weight:600">en curso</span>' : fmtDur(sessionDuration(s))}</td>
          <td style="color:var(--gray)">${esc(s.ip || '—')}</td>
        </tr>`;
      }).join('')}</tbody></table></div>`);
}
function openAccessModal(email, bodyHtml) {
  closeAccessModal();
  const m = document.createElement('div');
  m.className = 'modal-backdrop'; m.id = 'access-modal';
  m.onclick = (e) => { if (e.target === m) closeAccessModal(); };
  m.innerHTML = `<div class="modal-box">
    <div class="modal-head">
      <span class="modal-title">👁 Accesos de ${esc(email)}</span>
      <button class="btn btn-outline btn-sm" onclick="closeAccessModal()">✕ Cerrar</button>
    </div>
    <div class="modal-body" id="access-modal-body">${bodyHtml}</div>
  </div>`;
  document.body.appendChild(m);
}
function setAccessModalBody(html) { const b = el('access-modal-body'); if (b) b.innerHTML = html; }
function closeAccessModal() { const m = el('access-modal'); if (m) m.remove(); }
function tsMs(ts) { return ts && ts.toDate ? ts.toDate().getTime() : (ts ? new Date(ts).getTime() : 0); }
// "En curso" solo si el latido es reciente. Las sesiones abandonadas (pestaña
// cerrada o recargada) dejan de latir y, pasado el umbral, muestran su duración
// real en vez de quedar "en curso" para siempre.
function sessionOpen(s) {
  if (s.ended) return false;
  const last = tsMs(s.lastSeenAt) || tsMs(s.startAt);
  return last > 0 && (Date.now() - last) < SESSION_LIVE_MS;
}
function sessionDuration(s) {
  const a = tsMs(s.startAt), b = tsMs(s.endAt) || tsMs(s.lastSeenAt);
  let d = (a && b && b > a) ? (b - a) : 0;
  if (d > MAX_SESSION_MS) d = MAX_SESSION_MS;   // tope: sesiones dejadas abiertas no inflan el total
  return d;
}
function fmtDur(ms) {
  if (!ms) return '—';
  const sec = Math.round(ms / 1000);
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m < 60) return m + 'm ' + s + 's';
  const h = Math.floor(m / 60), mm = m % 60;
  return h + 'h ' + mm + 'm';
}
function fmtDateTime(ms) {
  if (!ms) return '—';
  const d = new Date(ms);
  return d.toLocaleDateString('es-UY', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' ' +
         d.toLocaleTimeString('es-UY', { hour:'2-digit', minute:'2-digit' });
}
function shortUA(ua) {
  if (!ua) return '—';
  let b = 'Navegador';
  if (/Edg/.test(ua)) b = 'Edge'; else if (/OPR|Opera/.test(ua)) b = 'Opera';
  else if (/Chrome/.test(ua)) b = 'Chrome'; else if (/Firefox/.test(ua)) b = 'Firefox';
  else if (/Safari/.test(ua)) b = 'Safari';
  let os = '';
  if (/Windows/.test(ua)) os = 'Windows'; else if (/Android/.test(ua)) os = 'Android';
  else if (/iPhone|iPad|iPod/.test(ua)) os = 'iOS'; else if (/Mac OS/.test(ua)) os = 'macOS';
  else if (/Linux/.test(ua)) os = 'Linux';
  return os ? (b + ' · ' + os) : b;
}

/* ── Analítica de dashboards (uso por pestaña dentro de los informes HTML) ── */
let _dashEvents = [];
let _pendingDashReport = null;   // informe a preseleccionar al entrar a la analítica

// Desde la lista de informes: ir a la analítica de dashboards con este informe
// preseleccionado en el combobox (si tiene datos de uso).
function goToReportStats(reportId, reportName) {

  switchTab('metrics-dashboards', document.getElementById('nav-metrics-dashboards'));
}

async function loadDashboardAnalytics() {
  const cont = el('metrics-dashboards');
  if (!cont) return;
  cont.innerHTML = '<div class="loading">Cargando analítica...</div>';
  try {
    const snap = await db.collection('dashboardEvents').orderBy('at', 'desc').limit(3000).get();
    _dashEvents = snap.docs.map(d => d.data());
  } catch (e) {
    cont.innerHTML = emptyHTML('⚠️', 'No se pudo cargar la analítica.<br>¿Publicaste las reglas de Firestore para <b>dashboardEvents</b>?');
    return;
  }
  renderDashboardAnalytics();
}

function renderDashboardAnalytics() {
  const cont = el('metrics-dashboards');
  if (!cont) return;
  const events = _dashEvents;
  if (!events.length) {
    _pendingDashReport = null;
    cont.innerHTML = emptyHTML('📈', 'Todavía no hay datos de uso.<br>Agregá el snippet de analítica a los dashboards (ver README).');
    return;
  }
  const reportNames = [...new Set(events.map(ev => ev.reportName || ev.reportId || '—'))]
    .sort((a, b) => String(a).localeCompare(String(b), 'es', { sensitivity: 'base' }));
  // Combobox de filtro por informe (función para reusar con distintas selecciones).
  const combo = (selVal) => `<div style="padding:.9rem 1.25rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)">
    <label style="font-size:.75rem;color:var(--gray);font-weight:600">Informe:</label>
    <select id="metrics-dash-report" class="fselect" style="min-width:220px;max-width:360px" onchange="renderDashboardAnalytics()">
      <option value="" ${selVal === '' ? 'selected' : ''}>— Todos los informes —</option>
      ${reportNames.map(n => `<option value="${esc(n)}" ${selVal === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}
    </select>
  </div>`;

  let sel = (el('metrics-dash-report') && el('metrics-dash-report').value) || '';
  // Si venimos del botón "Estadísticas" de un informe, lo preseleccionamos. Si ese
  // informe no tiene datos de uso, mostramos el mensaje "Sin datos analíticos".
  if (_pendingDashReport) {
    const cand = [_pendingDashReport.name, _pendingDashReport.id].filter(Boolean);
    const match = reportNames.find(n => cand.includes(n));
    const nm = _pendingDashReport.name || _pendingDashReport.id || '';
    _pendingDashReport = null;
    if (!match) {
      cont.innerHTML = combo('') + emptyHTML('📈', `Sin datos analíticos para «${esc(nm)}».<br>Este informe todavía no registró uso.`);
      return;
    }
    sel = match;
  }

  // Agrupar por informe → sección
  const byReport = {};
  events.forEach(ev => {
    const r = ev.reportName || ev.reportId || '—';
    if (!byReport[r]) byReport[r] = { opens: 0, sections: {}, activity: 0 };
    if (ev.event === 'open') { byReport[r].opens++; byReport[r].activity++; }
    else if (ev.event === 'tab' && ev.section) {
      const s = byReport[r].sections[ev.section] || (byReport[r].sections[ev.section] = { visits: 0, totalMs: 0 });
      s.visits++; s.totalMs += (ev.dwellMs || 0);
      byReport[r].activity++;
    }
  });
  let reports = Object.keys(byReport).sort((a, b) => byReport[b].activity - byReport[a].activity);
  if (sel) reports = reports.filter(r => r === sel);
  if (!reports.length) { cont.innerHTML = combo(sel) + emptyHTML('🔎', 'No hay datos para ese informe.'); return; }

  cont.innerHTML = combo(sel) + reports.map(r => {
    const d = byReport[r];
    const secs = Object.keys(d.sections).sort((a, b) => d.sections[b].visits - d.sections[a].visits);
    const rowsHtml = secs.length ? secs.map(s => {
      const x = d.sections[s];
      return `<tr>
        <td style="font-weight:600">${esc(s)}</td>
        <td>${x.visits}</td>
        <td>${fmtDur(x.totalMs)}</td>
        <td style="color:var(--gray)">${fmtDur(x.visits ? Math.round(x.totalMs / x.visits) : 0)}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="4" style="color:var(--gray)">Sin datos de pestañas (el dashboard no envió secciones).</td></tr>';
    return `<div style="padding:1rem 1.5rem;border-bottom:1px solid var(--border)">
      <div style="font-weight:700;color:var(--dark);margin-bottom:.6rem">📊 ${esc(r)} · <span style="color:var(--gray);font-weight:600">${d.opens} apertura(s)</span></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Pestaña / sección</th><th>Visitas</th><th>Tiempo total</th><th>Tiempo prom.</th></tr></thead>
        <tbody>${rowsHtml}</tbody></table></div>
    </div>`;
  }).join('');
}

/* ── ARCHIVOS: tipos soportados ── */
// Se admite subir CUALQUIER tipo de archivo. Los formatos con visor integrado
// (HTML, PDF, Word, PowerPoint, video) se muestran inline dentro del portal; el
// resto se ofrece para descarga.
const VIDEO_EXT = ['mp4','webm','ogg','ogv','mov','m4v'];
// Extensiones con visor inline (informativo; ya no se usa para bloquear subidas).
const VIEWABLE_EXT = ['html','htm','pdf','doc','docx','ppt','pptx'].concat(VIDEO_EXT);
function extOf(name)   { const m = String(name).toLowerCase().match(/\.([a-z0-9]+)$/); return m ? m[1] : ''; }
function isViewable(name){ return VIEWABLE_EXT.includes(extOf(name)); }
function fileKind(name) {
  const e = extOf(name);
  if (e === 'pdf') return 'pdf';
  if (VIDEO_EXT.includes(e)) return 'video';
  if (['doc','docx','ppt','pptx'].includes(e)) return 'office';
  if (e === 'html' || e === 'htm' || e === '') return 'html'; // HTML e informes previos sin extensión
  return 'download'; // cualquier otro formato: se ofrece descarga (no hay visor)
}
const ARCHIVE_EXT = ['zip','rar','7z','tar','gz','tgz','bz2'];
const IMAGE_EXT   = ['png','jpg','jpeg','gif','webp','svg','bmp','tif','tiff','heic','avif'];
const SHEET_EXT   = ['xls','xlsx','xlsm','csv','tsv','ods'];
const AUDIO_EXT   = ['mp3','wav','m4a','aac','flac','oga'];
function fileIcon(name) {
  const e = extOf(name);
  if (e === 'pdf')                 return '📕';
  if (e === 'doc' || e === 'docx') return '📘';
  if (e === 'ppt' || e === 'pptx') return '📙';
  if (VIDEO_EXT.includes(e))       return '🎬';
  if (e === 'html' || e === 'htm' || e === '') return '🌐';
  if (SHEET_EXT.includes(e))       return '📗';
  if (ARCHIVE_EXT.includes(e))     return '🗜️';
  if (IMAGE_EXT.includes(e))       return '🖼️';
  if (AUDIO_EXT.includes(e))       return '🎵';
  if (e === 'txt' || e === 'rtf' || e === 'md') return '📄';
  return '📎'; // otros formatos (descargables)
}
function guessContentType(name) {
  return ({
    html:'text/html', htm:'text/html', pdf:'application/pdf',
    doc:'application/msword',
    docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    ppt:'application/vnd.ms-powerpoint',
    pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',
    mp4:'video/mp4', m4v:'video/mp4', webm:'video/webm',
    ogg:'video/ogg', ogv:'video/ogg', mov:'video/quicktime'
  })[extOf(name)] || 'application/octet-stream';
}

// ── Caducidad de acceso (por usuario + informe) ──
// El admin puede fijar una fecha de caducidad, guardada en
// userAccess/{uid}.options[reportId].expiresAt ('YYYY-MM-DD'). El acceso vale
// durante todo ese día; a partir del día siguiente (por hora del sistema del
// cliente) queda caducado y el informe no se muestra.
function accessExpired(opts) {
  const exp = opts && opts.expiresAt;
  if (!exp) return false;
  const end = new Date(String(exp) + 'T23:59:59.999');   // fin del día indicado, hora local
  if (isNaN(end.getTime())) return false;
  return Date.now() > end.getTime();
}
function showAccessExpired() {
  alert('⛔ Acceso Caducado\n\nTu acceso a este informe venció. Si necesitás verlo nuevamente, contactá al administrador.');
}

  pptxCss:    'https://cdn.jsdelivr.net/gh/meshesha/PPTXjs@master/css/pptxjs.min.css',
};
const _loadedLibs = {};
function loadScript(src) {
  if (_loadedLibs[src]) return _loadedLibs[src];
  _loadedLibs[src] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = () => res();
    s.onerror = () => rej(new Error('No se pudo cargar la librería: ' + src));
    document.head.appendChild(s);
  });
  return _loadedLibs[src];
}
function loadCss(href) {
  if (_loadedLibs[href]) return;
  _loadedLibs[href] = true;
  const l = document.createElement('link');
  l.rel = 'stylesheet'; l.href = href;
  document.head.appendChild(l);
}
// docx-preview necesita JSZip 3.x y PPTXjs la API de JSZip 2.x: no pueden compartir
// window.JSZip. Cargamos cada versión una vez, la guardamos en un slot y activamos
// la correcta como global antes de cada render.
async function useJSZip(url, slot) {
  if (!window[slot]) {
    await loadScript(url);
    window[slot] = window.JSZip;
  }
  window.JSZip = window[slot];
}

function inject(tplId) { document.getElementById('root').innerHTML = document.getElementById(tplId).innerHTML; }
function showAlert(id, type, msg) {
  const e = el(id); if(!e) return;
  e.className = `alert alert-${type}`; e.innerHTML = msg;
  e.classList.remove('hidden');
}
function clearAlert(id) { const e = el(id); if(e){ e.className='hidden'; e.textContent=''; } }
function emptyHTML(icon, text) {
  return `<div class="empty"><div class="empty-icon">${icon}</div><p>${text}</p></div>`;
}
function fmtSize(bytes) {
  if (!bytes) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}
function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('es-UY', {day:'2-digit', month:'2-digit', year:'numeric'});
}
