<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipos Consultores — Portal de Informes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- Firebase SDK MODULAR (v10.7.0). Usamos el SDK modular (NO compat) porque el
       TOTP de la verificación en dos pasos (2FA) sólo existe en el SDK modular.
       Para no reescribir las ~2000 líneas de la app, construimos una fachada con
       la MISMA forma que la API compat (auth, db, storage, firebase.firestore.
       FieldValue) sobre UNA sola app: así Auth, Firestore y Storage comparten el
       mismo token de sesión y el 2FA/TOTP funciona de verdad. La config se toma
       de window.firebaseConfig (definida en el <script> principal). -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
             sendPasswordResetEmail, sendEmailVerification, signOut, multiFactor, TotpMultiFactorGenerator, getMultiFactorResolver }
      from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
    import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc,
             query, where, orderBy, limit, writeBatch, serverTimestamp, increment, deleteField }
      from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
    import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL, deleteObject }
      from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js';

    try {
      const app = initializeApp(window.firebaseConfig);
      const mAuth = getAuth(app);
      const mDb = getFirestore(app);
      const mStorage = getStorage(app);

      // ── Fachada Firestore (forma "compat" sobre primitivas modulares) ──
      const wrapDocSnap = (s) => ({ exists: s.exists(), id: s.id, data: () => s.data(), ref: wrapDoc(s.ref) });
      const wrapQuerySnap = (qs) => {
        const docs = qs.docs.map(d => ({ id: d.id, data: () => d.data(), ref: wrapDoc(d.ref) }));
        return { empty: qs.empty, size: qs.size, docs, forEach: (cb) => docs.forEach(cb) };
      };
      function wrapDoc(dref) {
        return {
          __dref: dref, id: dref.id,
          get: () => getDoc(dref).then(wrapDocSnap),
          set: (data, opts) => (opts && opts.merge) ? setDoc(dref, data, { merge: true }) : setDoc(dref, data),
          update: (data) => updateDoc(dref, data),
          delete: () => deleteDoc(dref),
          collection: (sub) => wrapCollection(`${dref.path}/${sub}`),
        };
      }
      function wrapQuery(q) {
        return {
          where: (f, op, val) => wrapQuery(query(q, where(f, op, val))),
          orderBy: (f, dir) => wrapQuery(query(q, orderBy(f, dir))),
          limit: (n) => wrapQuery(query(q, limit(n))),
          get: () => getDocs(q).then(wrapQuerySnap),
        };
      }
      function wrapCollection(path) {
        const cref = collection(mDb, path);
        return {
          doc: (id) => wrapDoc(id ? doc(cref, id) : doc(cref)),
          where: (f, op, val) => wrapQuery(query(cref, where(f, op, val))),
          orderBy: (f, dir) => wrapQuery(query(cref, orderBy(f, dir))),
          limit: (n) => wrapQuery(query(cref, limit(n))),
          get: () => getDocs(cref).then(wrapQuerySnap),
          add: (data) => addDoc(cref, data).then(wrapDoc),
        };
      }
      function wrapBatch() {
        const b = writeBatch(mDb);
        const api = {
          set: (r, data, opts) => { (opts && opts.merge) ? b.set(r.__dref, data, { merge: true }) : b.set(r.__dref, data); return api; },
          update: (r, data) => { b.update(r.__dref, data); return api; },
          delete: (r) => { b.delete(r.__dref); return api; },
          commit: () => b.commit(),
        };
        return api;
      }
      const db = { collection: wrapCollection, batch: wrapBatch };

      // ── Fachada Storage (forma "compat") ──
      const storage = {
        ref: (path) => {
          const r = storageRef(mStorage, path);
          return {
            // uploadBytesResumable devuelve un UploadTask cuyo .on('state_changed', …)
            // tiene exactamente la misma firma que en compat.
            put: (file, meta) => uploadBytesResumable(r, file, meta),
            getDownloadURL: () => getDownloadURL(r),
            delete: () => deleteObject(r),
          };
        },
      };

      // ── Fachada Auth (forma "compat") ──
      const auth = {
        get currentUser() { return mAuth.currentUser; },
        get languageCode() { return mAuth.languageCode; },
        set languageCode(v) { mAuth.languageCode = v; },
        onAuthStateChanged: (cb) => onAuthStateChanged(mAuth, cb),
        signInWithEmailAndPassword: (email, pass) => signInWithEmailAndPassword(mAuth, email, pass),
        createUserWithEmailAndPassword: (email, pass) => createUserWithEmailAndPassword(mAuth, email, pass),
        sendPasswordResetEmail: (email) => sendPasswordResetEmail(mAuth, email),
        signOut: () => signOut(mAuth),
      };

      // firebase.firestore.FieldValue (usado por la app para timestamps/increment/delete).
      const firestoreNs = () => db;
      firestoreNs.FieldValue = {
        serverTimestamp: () => serverTimestamp(),
        increment: (n) => increment(n),
        delete: () => deleteField(),
      };

      window.firebase = { initializeApp: () => app, auth: () => auth, firestore: firestoreNs, storage: () => storage };
      window.auth = auth; window.db = db; window.storage = storage;

      // 2FA/TOTP sobre la MISMA app (ya comparte sesión con Firestore/Storage).
      window.__mfa = {
        auth: mAuth, multiFactor, TotpMultiFactorGenerator, getMultiFactorResolver,
        signInWithEmailAndPassword: (a, email, pass) => signInWithEmailAndPassword(a, email, pass),
        sendEmailVerification: (user) => sendEmailVerification(user),
      };

      window.__firebaseReady = true;
      window.dispatchEvent(new Event('firebase-ready'));
    } catch (e) {
      console.error('No se pudo iniciar Firebase (SDK modular):', e);
      window.__firebaseError = e;
      window.dispatchEvent(new Event('firebase-error'));
    }
  </script>
  <style>
    /* ── Brand tokens (extraídos del PPTX de marca) ── */
    :root {
      --orange:       #E96436;
      --orange-dark:  #C8512A;
      --orange-light: #FDF0EB;
      --dark:         #3A3838;
      --dark2:        #222222;
      --gray:         #7A7A7A;
      --gray-light:   #EEEEEE;
      --gray-xlight:  #F7F7F7;
      --white:        #FFFFFF;
      --border:       #E2E2E2;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--gray-xlight);
      color: var(--dark2);
      line-height: 1.55;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, h4 { font-weight: 800; letter-spacing: -0.02em; color: var(--dark); }

    /* ══════════════════════════════════════
       LOGO (imágenes reales embebidas)
    ══════════════════════════════════════ */
    .logo-horizontal       { height: 40px;  width: auto; display: block; }
    .logo-horizontal-white { height: 90px;  width: auto; display: block; }
    .logo-icon             { height: 80px;  width: auto; display: block; margin: 0 auto; }

    /* ══════════════════════════════════════
       LOGIN
    ══════════════════════════════════════ */
    .login-wrap { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }

    .login-brand {
      background: var(--dark);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 3rem;
      position: relative; overflow: hidden;
    }
    .login-brand::before {
      content: ''; position: absolute;
      bottom: 8%; left: -30px;
      width: 140px; height: 140px;
      background: var(--orange); opacity: 0.9;
    }
    .login-brand::after {
      content: ''; position: absolute;
      top: 10%; right: -20px;
      width: 80px; height: 80px;
      background: var(--orange); opacity: 0.18;
    }
    .login-brand-inner { position: relative; z-index: 1; text-align: center; max-width: 360px; }
    .login-brand-logo { margin-bottom: 2rem; }
    .login-brand-logo img { height: 110px; width: auto; margin: 0 auto; display: block; }

    .login-brand .tagline {
      font-size: 1.75rem; font-weight: 800; color: var(--white);
      letter-spacing: -0.025em; line-height: 1.15;
    }
    .login-brand .tagline em {
      color: var(--orange); font-style: normal; display: block;
    }
    .login-brand .tagline em + em { margin-top: 0.1em; }
    .login-brand .tagline-sub {
      margin-top: 1.5rem; font-size: 0.82rem;
      color: rgba(255,255,255,0.55); font-weight: 500;
      letter-spacing: 0.02em;
    }

    .login-form-panel {
      background: var(--white);
      display: flex; align-items: center; justify-content: center;
      padding: 3rem;
    }
    .login-form-inner { width: 100%; max-width: 380px; }
    .login-form-inner h1 {
      font-size: 1.7rem; font-weight: 800; color: var(--dark);
      letter-spacing: -0.03em; margin-bottom: 0.35rem;
    }
    .login-sub { font-size: 0.85rem; color: var(--gray); margin-bottom: 2rem; font-weight: 500; }
    .login-forgot { margin-top: 1rem; text-align: center; }
    .login-forgot a {
      font-size: 0.82rem; font-weight: 600; color: var(--orange);
      text-decoration: none; cursor: pointer;
    }
    .login-forgot a:hover { text-decoration: underline; }

    @media (max-width: 700px) {
      .login-wrap { grid-template-columns: 1fr; }
      .login-brand { display: none; }
    }

    /* ══════════════════════════════════════
       FORM
    ══════════════════════════════════════ */
    label {
      display: block; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--dark); margin-bottom: 0.5rem;
    }
    input[type=email], input[type=password], input[type=text], select.fselect {
      width: 100%; padding: 0.75rem 1rem;
      border: 1.5px solid var(--border); border-radius: 3px;
      font-family: 'Montserrat', sans-serif; font-size: 0.9rem;
      font-weight: 500; color: var(--dark2); background: var(--white);
      outline: none; transition: all 0.2s;
    }
    input:focus, select.fselect:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(233,100,54,0.12);
    }
    .form-group { margin-bottom: 1.25rem; }

    /* ══════════════════════════════════════
       BUTTONS
    ══════════════════════════════════════ */
    button { cursor: pointer; font-family: 'Montserrat', sans-serif; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      padding: 0.7rem 1.3rem; border-radius: 3px; border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      transition: all 0.18s;
    }
    .btn-orange { background: var(--orange); color: var(--white); }
    .btn-orange:hover { background: var(--orange-dark); transform: translateY(-1px); box-shadow: 0 5px 16px rgba(233,100,54,0.35); }
    .btn-dark { background: var(--dark); color: var(--white); }
    .btn-dark:hover { background: var(--dark2); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--dark); }
    .btn-outline:hover { border-color: var(--orange); color: var(--orange); }
    .btn-outline-dark { background: transparent; border: 1.5px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.75); }
    .btn-outline-dark:hover { border-color: var(--orange); color: var(--orange); }
    .btn-danger { background: #B83A26; color: var(--white); }
    .btn-danger:hover { background: #962E1E; }
    .btn-sm { padding: 0.42rem 0.85rem; font-size: 0.7rem; }
    .btn-full { width: 100%; padding: 0.9rem; font-size: 0.82rem; }

    /* ══════════════════════════════════════
       APP LAYOUT
    ══════════════════════════════════════ */
    .app { display: flex; min-height: 100vh; }

    .sidebar {
      width: 240px; flex-shrink: 0;
      background: var(--dark);
      display: flex; flex-direction: column;
      position: fixed; height: 100vh; z-index: 10;
    }
    .sidebar-top {
      padding: 1.5rem 1.2rem 1.3rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-section-label {
      font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.32);
      padding: 1.1rem 1.2rem 0.5rem;
    }
    .nav-item {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.75rem 1.2rem; width: 100%; text-align: left;
      border: none; background: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.6);
      transition: all 0.15s; cursor: pointer;
    }
    .nav-item:hover { color: var(--white); background: rgba(255,255,255,0.05); }
    .nav-item.active {
      color: var(--white); background: var(--orange);
      font-weight: 700;
    }
    .nav-item .nav-icon { font-size: 1rem; width: 20px; text-align: center; opacity: 0.9; }
    /* Sub-ítems (p. ej. las páginas de Métricas) */
    .nav-subitem { padding: 0.5rem 1.2rem 0.5rem 2.9rem; font-size: 0.76rem; font-weight: 500; color: rgba(255,255,255,0.5); }
    .nav-subitem .nav-icon { font-size: 0.5rem; width: 12px; }
    .nav-item.active-parent { color: var(--white); }

    .sidebar-footer {
      margin-top: auto;
      padding: 1rem 1.2rem 1.2rem;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .user-pill { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.9rem; }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--orange); color: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.9rem; flex-shrink: 0;
    }
    .user-info-wrap { overflow: hidden; min-width: 0; }
    .user-email {
      font-size: 0.74rem; font-weight: 600; color: var(--white);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .user-role { font-size: 0.62rem; color: rgba(255,255,255,0.4); margin-top: 2px; letter-spacing: 0.03em; }

    .main { margin-left: 240px; flex: 1; padding: 2.25rem 2.5rem; }

    /* ══════════════════════════════════════
       PAGE HEADER
    ══════════════════════════════════════ */
    .page-header { margin-bottom: 2rem; }
    .accent-bar {
      height: 4px; width: 44px;
      background: var(--orange);
      margin-bottom: 1rem;
    }
    .page-header h2 {
      font-size: 1.5rem; font-weight: 800; color: var(--dark);
      letter-spacing: -0.025em; margin-bottom: 0.2rem;
    }
    .page-header h2 .accent { color: var(--orange); }
    .page-header p { font-size: 0.85rem; color: var(--gray); font-weight: 500; }

    /* ══════════════════════════════════════
       CARDS
    ══════════════════════════════════════ */
    .card { background: var(--white); border-radius: 4px; border: 1px solid var(--border); }
    .card + .card { margin-top: 1.25rem; }
    .card-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-header-title {
      font-size: 0.8rem; font-weight: 700; color: var(--dark);
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .card-body { padding: 1.5rem; }

    /* ══════════════════════════════════════
       TABLE
    ══════════════════════════════════════ */
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; font-size: 0.68rem; font-weight: 700;
      color: var(--gray); text-transform: uppercase; letter-spacing: 0.08em;
      padding: 0.75rem 1.5rem; background: var(--gray-xlight);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 0.9rem 1.5rem; border-bottom: 1px solid var(--border);
      font-size: 0.84rem; vertical-align: middle; font-weight: 500;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #FAFAFA; }
    .folder-row td { background: var(--gray-xlight); }
    .folder-row:hover td { background: var(--orange-light); }
    .td-actions { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }

    /* ══════════════════════════════════════
       UPLOAD
    ══════════════════════════════════════ */
    .upload-zone {
      border: 2px dashed var(--border); border-radius: 4px;
      padding: 2.75rem 1.5rem; text-align: center; cursor: pointer;
      transition: all 0.2s; background: var(--gray-xlight);
    }
    .upload-zone:hover, .upload-zone.drag {
      border-color: var(--orange); background: var(--orange-light);
    }
    .upload-zone .upload-icon { font-size: 2.3rem; margin-bottom: 0.7rem; }
    .upload-zone p { font-size: 0.85rem; color: var(--gray); font-weight: 500; }
    .upload-zone p strong { color: var(--orange); font-weight: 700; }
    .upload-zone .hint { font-size: 0.74rem; margin-top: 0.35rem; color: #ABABAB; font-weight: 500; }

    .progress-wrap { margin-top: 1.1rem; }
    .progress-meta {
      display: flex; justify-content: space-between;
      font-size: 0.76rem; color: var(--gray);
      margin-bottom: 0.45rem; font-weight: 600;
    }
    .progress { height: 6px; background: var(--gray-light); border-radius: 3px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--orange); border-radius: 3px; transition: width 0.25s; }

    /* ══════════════════════════════════════
       PERMISSIONS
    ══════════════════════════════════════ */
    .perm-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.75rem; margin-top: 1rem;
    }
    .perm-item {
      display: flex; flex-direction: column; align-items: stretch; gap: 0.55rem;
      padding: 0.85rem 1rem; border: 1.5px solid var(--border);
      border-radius: 3px; transition: all 0.18s;
    }
    .perm-item.granted { border-color: var(--orange); background: var(--orange-light); }
    .perm-head {
      display: flex; align-items: center; gap: 0.65rem;
      cursor: pointer; user-select: none;
    }
    .perm-head input[type=checkbox] {
      width: 16px; height: 16px; accent-color: var(--orange);
      flex-shrink: 0; cursor: pointer;
    }
    .perm-item .perm-label {
      font-size: 0.82rem; font-weight: 600; color: var(--dark);
      cursor: pointer; word-break: break-word;
    }
    .perm-opts {
      display: grid; gap: 0.35rem; padding: 0.55rem 0 0.15rem 1.65rem;
      border-top: 1px dashed var(--border);
    }
    .perm-opts.disabled { display: none; }
    .perm-opt {
      display: flex; align-items: center; gap: 0.45rem;
      font-size: 0.72rem; font-weight: 600; color: var(--gray);
      cursor: pointer; user-select: none;
    }
    .perm-opt input[type=checkbox] {
      width: 14px; height: 14px; accent-color: var(--orange);
      flex-shrink: 0; cursor: pointer;
    }

    /* ══════════════════════════════════════
       REPORT VIEWER
    ══════════════════════════════════════ */
    .viewer {
      position: fixed; inset: 0; background: var(--gray-xlight);
      z-index: 100; display: flex; flex-direction: column;
    }
    .viewer-bar {
      background: var(--dark); padding: 0.9rem 1.5rem;
      display: flex; align-items: center; gap: 1rem; flex-shrink: 0;
    }
    .viewer-title {
      font-size: 0.85rem; font-weight: 600; color: var(--white);
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .viewer-bar { position: relative; z-index: 3; }
    .viewer-content {
      flex: 1; overflow: auto; position: relative;
      background: var(--gray-xlight);
    }
    .viewer-frame { border: none; width: 100%; height: 100%; background: #fff; display: block; }
    .video-wrap { display: flex; align-items: center; justify-content: center; height: 100%; padding: 16px; box-sizing: border-box; }
    .viewer-video { max-width: 100%; max-height: 100%; background: #000; border-radius: 4px; }
    /* Marca de agua: mosaico diagonal fijo sobre el contenido, no intercepta clics */
    .wm-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    /* Bloqueo de selección / clic derecho */
    .viewer.no-copy .viewer-content { user-select: none; -webkit-user-select: none; }
    /* Render de PDF (canvas por página) */
    .pdf-pages { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px; }
    .pdf-page { max-width: 100%; height: auto; box-shadow: 0 2px 14px rgba(0,0,0,0.18); background: #fff; }
    /* Render de Word / PowerPoint */
    .docx-wrap { background: #fff; margin: 18px auto; max-width: 100%; box-shadow: 0 2px 14px rgba(0,0,0,0.12); }
    .pptx-wrap { padding: 14px; max-width: 100%; }
    /* Bloqueo de impresión: si está activo, la impresión sale en blanco */
    @media print {
      body.no-print-active * { visibility: hidden !important; }
      body.no-print-active::before {
        content: "🔒 La impresión de este documento está deshabilitada.";
        visibility: visible; position: fixed; top: 45%; left: 0; right: 0;
        text-align: center; font-size: 20px; color: #333; font-family: sans-serif;
      }
    }

    /* ══════════════════════════════════════
       REPORT CARDS (user view)
    ══════════════════════════════════════ */
    .report-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 1.15rem;
    }
    .report-card {
      background: var(--white); border: 1.5px solid var(--border);
      border-radius: 4px; padding: 1.5rem; cursor: pointer;
      transition: all 0.2s; position: relative; overflow: hidden;
    }
    .report-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 4px; background: var(--orange);
      transform: scaleY(0); transform-origin: bottom;
      transition: transform 0.2s;
    }
    .report-card:hover {
      border-color: var(--orange);
      box-shadow: 0 4px 18px rgba(233,100,54,0.13);
      transform: translateY(-2px);
    }
    .report-card:hover::before { transform: scaleY(1); }
    .report-card-icon { font-size: 2rem; margin-bottom: 0.85rem; }
    .report-card h3 {
      font-size: 0.92rem; font-weight: 700; color: var(--dark);
      margin-bottom: 0.35rem; word-break: break-word; letter-spacing: -0.005em;
    }
    .report-card .meta { font-size: 0.74rem; color: var(--gray); font-weight: 600; }
    /* Informe con acceso caducado: apagado y en rojo, sin efecto hover naranja. */
    .report-card.expired { background: #FBF3F2; border-color: #E7C3BD; opacity: .9; }
    .report-card.expired .report-card-icon { filter: grayscale(1); opacity: .55; }
    .report-card.expired h3 { color: var(--gray); }
    .report-card.expired:hover { border-color: #C0392B; box-shadow: 0 4px 18px rgba(192,57,43,0.13); }
    .report-card.expired::before { background: #C0392B; }
    .report-card .meta.expired-meta { color: #C0392B; font-weight: 800; }
    /* Matriz usuarios/informes */
    .matrix-wrap { overflow: auto; max-height: 72vh; margin-top: .5rem; }
    table.matrix { border-collapse: separate; border-spacing: 0; font-size: .8rem; }
    table.matrix th, table.matrix td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    table.matrix thead th { background: var(--gray-xlight); }
    table.matrix th.mx-corner { position: sticky; left: 0; top: 0; z-index: 4; background: var(--gray-light); text-align: left; padding: .4rem .6rem; white-space: nowrap; border-left: 1px solid var(--border); border-top: 1px solid var(--border); }
    table.matrix th.mx-user { position: sticky; top: 0; z-index: 3; height: 150px; padding: .25rem; vertical-align: bottom; border-top: 1px solid var(--border); }
    table.matrix th.mx-user > span { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 600; color: var(--dark); max-height: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    table.matrix th.mx-total-col { position: sticky; top: 0; z-index: 3; padding: .3rem .55rem; border-top: 1px solid var(--border); }
    table.matrix td.mx-name { position: sticky; left: 0; z-index: 2; background: var(--white); text-align: left; padding: .35rem .6rem; font-weight: 600; white-space: nowrap; border-left: 1px solid var(--border); }
    table.matrix tbody tr:hover td { background: #FAFAFA; }
    table.matrix tbody tr:hover td.mx-name { background: var(--orange-light); }
    table.matrix td.mx-cell { text-align: center; width: 2rem; min-width: 2rem; }
    table.matrix .mx-yes { color: #1E9E57; font-weight: 800; }
    table.matrix .mx-no { color: #D9D9D9; }
    table.matrix td.mx-total, table.matrix th.mx-total-col { text-align: center; font-weight: 700; color: var(--gray); background: var(--gray-xlight); }
    table.matrix tfoot td { position: sticky; bottom: 0; z-index: 2; background: var(--gray-xlight); font-weight: 700; text-align: center; }
    table.matrix tfoot td.mx-name { left: 0; z-index: 3; text-align: left; color: var(--dark); }
    /* Navegación por carpetas (cliente) y árbol de carpetas (admin) */
    .breadcrumb { display:flex; flex-wrap:wrap; align-items:center; gap:.35rem; margin-bottom:1.15rem; font-size:.85rem; font-weight:600; }
    .breadcrumb a { color:var(--orange); cursor:pointer; text-decoration:none; }
    .breadcrumb a:hover { text-decoration:underline; }
    .breadcrumb .sep { color:var(--gray); }
    .breadcrumb .current { color:var(--dark); }
    .folder-tree-row { display:flex; align-items:center; gap:.5rem; padding:.5rem .1rem; border-bottom:1px solid #f0f0f0; flex-wrap:wrap; }
    .folder-tree-row .fname { font-weight:600; color:var(--dark); white-space:nowrap; }
    .folder-tree-row .ftree-name { display:flex; align-items:center; gap:.4rem; flex:0 0 auto; min-width:300px; }
    .folder-tree-row .ftree-move { font-size:.75rem; color:var(--gray); font-weight:600; white-space:nowrap; }
    .folder-tree-empty { color:var(--gray); font-size:.85rem; font-weight:500; padding:.5rem 0; }
    /* Selector de usuarios por informe (modal) */
    .user-pick-list { max-height:340px; overflow-y:auto; border:1px solid var(--border); border-radius:4px; }
    .user-pick { display:flex; align-items:center; gap:.6rem; padding:.55rem .7rem; border-bottom:1px solid #f0f0f0; cursor:pointer; }
    .user-pick:last-child { border-bottom:none; }
    .user-pick:hover { background:#faf7f5; }
    .user-pick input { flex:0 0 auto; }
    .user-pick-avatar { width:26px; height:26px; border-radius:50%; background:var(--orange); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; flex:0 0 auto; }
    .user-pick-email { font-size:.85rem; font-weight:600; color:var(--dark); word-break:break-word; }

    /* ══════════════════════════════════════
       ALERTS & BADGES
    ══════════════════════════════════════ */
    .alert {
      padding: 0.8rem 1rem; border-radius: 3px; font-size: 0.82rem;
      font-weight: 600; margin-bottom: 1rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .alert-error   { background: #FEF0EF; color: #8B1A0A; border-left: 3px solid #B83A26; }
    .alert-success { background: var(--orange-light); color: var(--orange-dark); border-left: 3px solid var(--orange); }

    .badge {
      display: inline-block; padding: 0.2rem 0.65rem; border-radius: 3px;
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .badge-admin { background: var(--orange); color: var(--white); }
    .badge-user  { background: var(--gray-light); color: var(--gray); }
    /* Badge con la cantidad de usuarios con acceso a un informe */
    .ucount-badge {
      display: inline-block; margin-left: .45rem; vertical-align: middle;
      font-size: .72rem; font-weight: 700; border-radius: 999px; padding: .08rem .5rem;
      background: var(--gray-light); color: var(--gray); white-space: nowrap;
    }
    .ucount-badge.has { background: var(--orange-light); color: var(--orange-dark); }

    .count-chip {
      font-size: 0.7rem; font-weight: 700;
      background: var(--gray-xlight); border: 1px solid var(--border);
      color: var(--gray); padding: 0.2rem 0.7rem; border-radius: 20px;
    }

    /* ══════════════════════════════════════
       STATES
    ══════════════════════════════════════ */
    .empty { text-align: center; padding: 3.5rem 1rem; color: var(--gray); }
    .empty .empty-icon { font-size: 2.8rem; margin-bottom: 0.85rem; }
    .empty p { font-size: 0.85rem; font-weight: 500; }
    .loading {
      display: flex; align-items: center; justify-content: center;
      padding: 3rem; color: var(--gray); gap: 0.6rem;
      font-size: 0.82rem; font-weight: 600;
    }

    .two-col { display: grid; grid-template-columns: 1fr 1fr auto; gap: 1rem; align-items: end; }
    @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

    /* ══════════════════════════════════════
       LOADING OVERLAY (Cargando informe)
    ══════════════════════════════════════ */
    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(58, 56, 56, 0.92);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .loading-box {
      background: var(--white);
      border-radius: 8px;
      padding: 2.5rem 3rem;
      max-width: 420px; width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .loading-box .accent-bar {
      margin: 0 auto 1.25rem;
    }
    .loading-box h3 {
      font-size: 1.15rem; font-weight: 800;
      color: var(--dark); margin-bottom: 0.4rem;
      letter-spacing: -0.01em;
    }
    .loading-box .loading-file {
      font-size: 0.78rem; color: var(--gray);
      font-weight: 600; margin-bottom: 1.5rem;
      word-break: break-word;
    }
    .loading-box .progress {
      height: 8px; background: var(--gray-light);
      border-radius: 4px; overflow: hidden;
      margin-bottom: 0.7rem;
    }
    .loading-box .progress-bar-anim {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--orange) 0%, #FF8A5C 50%, var(--orange) 100%);
      background-size: 200% 100%;
      border-radius: 4px;
      transition: width 0.3s ease-out;
      animation: shimmer 1.5s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .loading-box .progress-pct {
      font-size: 0.75rem; color: var(--gray);
      font-weight: 700; letter-spacing: 0.05em;
    }

    /* Filtro de fechas en métricas */
    .metrics-filter { display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
    .metrics-filter input[type=date] {
      padding: 0.5rem 0.6rem; border: 1.5px solid var(--border); border-radius: 3px;
      font-family: inherit; font-size: 0.82rem; color: var(--dark);
    }

    /* Diálogo modal (accesos por usuario) */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(58,56,56,0.6);
      z-index: 150; display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-box {
      background: var(--white); border-radius: 6px; width: 100%; max-width: 640px;
      max-height: 85vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--white);
    }
    .modal-title { font-size: 0.95rem; font-weight: 800; color: var(--dark); word-break: break-word; }
    .modal-body { padding: 1.1rem 1.25rem; }
    /* Verificación en dos pasos (2FA) */
    .mfa-box { text-align: center; }
    .mfa-box h2 { font-size: 1.2rem; font-weight: 800; color: var(--dark); margin: 0 0 .35rem; }
    .mfa-sub { font-size: .85rem; color: var(--gray); font-weight: 500; margin: 0 0 1rem; }
    .mfa-qr { display: flex; justify-content: center; margin: 0 0 .7rem; }
    .mfa-qr img, .mfa-qr canvas { border: 1px solid var(--border); border-radius: 6px; }
    .mfa-secret { font-size: .78rem; color: var(--gray); margin: .1rem 0 1rem; }
    #mfa-code { text-align: center; letter-spacing: .4em; font-size: 1.2rem; font-weight: 700; margin-bottom: .8rem; }

    .hidden { display: none !important; }
  </style>
</head>

      <div id="tab-reports">
        <div class="page-header">

        <div class="card">
          <div class="card-header"><span class="card-header-title">Subir nuevo informe</span></div>
          <div class="card-body">
            <div class="form-group" style="max-width:420px">
              <label>Subir a la carpeta</label>
              <select id="upload-folder-select" class="fselect"><option value="">— Raíz —</option></select>
            </div>
            <div class="upload-zone" id="upload-area"
              onclick="document.getElementById('file-input').click()"
              ondragover="handleDragOver(event)"
              ondrop="handleDrop(event)"
              ondragleave="handleDragLeave(event)">
              <div class="upload-icon">📁</div>
              <p><strong>Hacé clic para subir</strong> o arrastrá archivos aquí</p>
              <p class="hint">Cualquier tipo de archivo · HTML, PDF, Word, PowerPoint y video se ven en el portal; el resto se descarga · Podés subir varios a la vez</p>
            </div>
            <input type="file" id="file-input" multiple class="hidden" onchange="handleFileSelect(event)" />

            <div id="upload-progress" class="hidden progress-wrap">
              <div class="progress-meta">
                <span id="upload-status">Subiendo...</span>
                <span id="upload-pct">0%</span>
              </div>
              <div class="progress"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <span class="card-header-title">Carpetas</span>

          <div class="card-body">
            <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem">
              <div class="form-group" style="margin:0;flex:1;min-width:200px">
                <label>Nueva carpeta</label>
                <input type="text" id="new-folder-name" placeholder="Nombre de la carpeta" />
              </div>
              <div class="form-group" style="margin:0;flex:1;min-width:200px">
                <label>Dentro de</label>
                <select id="new-folder-parent" class="fselect"><option value="">— Raíz —</option></select>
              </div>
              <div class="form-group" style="margin:0;flex:0 0 auto;align-self:center">
                <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;white-space:nowrap;font-weight:600" title="Si se desmarca, los clientes no verán la carpeta: verán su contenido (subcarpetas e informes) un nivel más arriba.">
                  <input type="checkbox" id="new-folder-visible" checked style="width:auto;margin:0" />

                </label>
              </div>
              <button class="btn btn-orange" onclick="createFolder()">➕ Crear carpeta</button>

<script>
/* ══════════════════════════════════════════════
   🔧 CONFIGURACIÓN FIREBASE
   Reemplazá los valores con los de tu proyecto
══════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyCNYTImSJphSSfcfPuMsgKWCFy26VH2fBk",
  authDomain: "portal-informes-ec.firebaseapp.com",
  projectId: "portal-informes-ec",
  storageBucket: "portal-informes-ec.firebasestorage.app",
  messagingSenderId: "1071042461319",
  appId: "1:1071042461319:web:1d13c64dc59acfe10a4222",
  measurementId: "G-Z04M5W003B"
};

// Firebase se inicializa en el <script type="module"> del <head> (SDK modular; el
// TOTP de 2FA sólo existe en modular). Publicamos la config para ese módulo y
// declaramos las referencias, que se completan en boot() cuando el módulo avisa.
window.firebaseConfig = firebaseConfig;
let auth, db, storage;

let currentUser = null, currentUserData = null;
let allReports = [], allUsers = [], allFolders = [];
let reportAccessCounts = {};   // { reportId: cantidad de usuarios con acceso }
let myAccessOptions = {};   // opciones de protección del usuario actual: { reportId: {watermark,noPrint,...} }
// Navegación por carpetas del cliente
let _userFolderId = null, _userReports = [], _userVisibleFolderIds = new Set();
let currentSessionId = null, _hbTimer = null, _sessionStarting = false;   // métricas de acceso
let _lastActivity = 0, _activityBound = false;   // detección de inactividad para el latido
let _loginNotice = null;   // aviso a mostrar en la pantalla de login (ej. acceso denegado)

// ── Modo "enlace público" ──
// Si la URL trae ?p=<token>, mostramos el informe sin login y sin tocar la app.
const _publicToken = new URLSearchParams(location.search).get('p');
let _publicMode = !!_publicToken;

/* ── ARRANQUE ──
   Firebase lo inicializa el módulo del <head> (SDK modular). Esperamos a que
   publique auth/db/storage y recién ahí fijamos el idioma, arrancamos el modo
   enlace público o registramos el listener de sesión. */
function boot() {
  auth = window.auth; db = window.db; storage = window.storage;
  // Los correos de Firebase Auth (restablecer contraseña, etc.) se envían en español.
  auth.languageCode = 'es';
  if (_publicMode) { renderPublicView(_publicToken); return; }
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      const snap = await db.collection('users').doc(user.uid).get();
      if (!snap.exists) {
        // Autenticado pero sin registro en el portal: fue borrado por un admin
        // o nunca se le dio acceso. No recreamos el doc ni lo dejamos entrar.
        _loginNotice = '⛔ Tu cuenta no tiene acceso al portal. Contactá al administrador.';
        currentUser = null; currentUserData = null;
        await auth.signOut();   // dispara de nuevo este listener con user=null → renderLogin()
        return;
      }
      currentUser = user;
      currentUserData = snap.data();
      // 2FA: si el admin lo exige y el usuario todavía no enroló un segundo factor,
      // lo obligamos a activarlo antes de entrar al portal. El listado de factores
      // se consulta con el SDK modular (TOTP no está en compat).
      const enrolled = mfaEnrolledFactors(user);
      if (currentUserData.mfaRequired && enrolled.length === 0) { startMfaEnrollment(); return; }
      enterPortal();
    } else {
      stopHeartbeat(); currentSessionId = null;
      currentUser = null; currentUserData = null;
      renderLogin();
    }
  });
}

// Pantalla de error si Firebase no llega a inicializarse.
function showFirebaseError() {
  const r = document.getElementById('root');
  if (r) r.innerHTML = '<div style="max-width:460px;margin:14vh auto;text-align:center;font-family:system-ui,Arial,sans-serif;color:#444">'
    + '<div style="font-size:2.4rem">⚠️</div><h1 style="font-size:1.15rem;color:#222">No se pudo cargar Firebase</h1>'
    + '<p style="color:#666;font-size:.9rem;line-height:1.5">Revisá tu conexión a internet y recargá la página.</p>'
    + '<button onclick="location.reload()" style="margin-top:.8rem;padding:.55rem 1.2rem;border:0;border-radius:8px;background:#E96436;color:#fff;font-weight:600;cursor:pointer">Recargar</button></div>';
}

// El módulo del <head> (SDK modular) avisa cuando Firebase quedó listo o si falló.
// El timer cubre el caso en que el import del CDN falla y el módulo ni siquiera
// corre (no dispararía firebase-error), para no dejar la pantalla en blanco.
if (window.__firebaseReady) boot();
else {
  const _fbTimer = setTimeout(() => { if (!window.__firebaseReady) showFirebaseError(); }, 15000);
  window.addEventListener('firebase-ready', () => { clearTimeout(_fbTimer); boot(); }, { once: true });
  window.addEventListener('firebase-error', () => { clearTimeout(_fbTimer); showFirebaseError(); }, { once: true });
}

// Entra al portal una vez superados el login y (si aplica) el segundo factor.
function enterPortal() {
  currentUserData.role === 'admin' ? renderAdmin() : renderUser();
  startSession();   // registra el acceso (una vez por carga autenticada)
}

/* ── 2FA (verificación en dos pasos, TOTP) ──
   TOTP solo existe en el SDK MODULAR de Firebase (no en compat), por eso usamos
   window.__mfa (cargado por el <script type="module"> del <head>, interoperando
   con la misma app). El admin marca users/{uid}.mfaRequired; Firebase hace el
   enforcement real: una vez enrolado el factor, el login exige el código. Si es
   requerido y aún no enroló, forzamos el enrolamiento. */
let _mfaResolver = null, _mfaSecret = null;

// Factores enrolados del usuario, consultados con el SDK modular ([] si no hay).
function mfaEnrolledFactors(user) {
  try {
    const m = window.__mfa;
    if (m && m.auth && m.auth.currentUser) return m.multiFactor(m.auth.currentUser).enrolledFactors || [];
  } catch (e) {}
  return (user && user.multiFactor && user.multiFactor.enrolledFactors) || [];
}

function openMfaModal(html) {
  closeMfaModal();
  const m = document.createElement('div');
  m.className = 'modal-backdrop'; m.id = 'mfa-modal';   // sin dismiss por backdrop: bloqueante
  m.innerHTML = `<div class="modal-box" style="max-width:430px"><div class="modal-body" id="mfa-modal-body">${html}</div></div>`;
  document.body.appendChild(m);
}
function setMfaModalBody(html) { const b = el('mfa-modal-body'); if (b) b.innerHTML = html; }
function closeMfaModal() { const m = el('mfa-modal'); if (m) m.remove(); }
function cancelMfa() { _mfaResolver = null; _mfaSecret = null; closeMfaModal(); auth.signOut(); }

async function renderQr(containerId, text) {
  const box = el(containerId); if (!box) return;
  box.innerHTML = '';
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js');
    new QRCode(box, { text: text, width: 200, height: 200 });
  } catch (e) {
    box.innerHTML = `<p class="mfa-secret">Escaneá esta URL en tu app:<br><code style="word-break:break-all">${esc(text)}</code></p>`;
  }
}

// Desafío en el login: el usuario ya tiene 2FA → pedimos el código de 6 dígitos.
function startMfaChallenge(error) {
  if (!window.__mfa) {
    showAlert('login-alert', 'error', '❌ No se pudo cargar el módulo de verificación en dos pasos. Recargá la página e intentá de nuevo.');
    return;
  }
  _mfaResolver = window.__mfa.getMultiFactorResolver(window.__mfa.auth, error);
  openMfaModal(`
    <div class="mfa-box">
      <div class="accent-bar" style="margin:0 auto .8rem"></div>
      <h2>Verificación en dos pasos</h2>
      <p class="mfa-sub">Ingresá el código de 6 dígitos de tu app de autenticación.</p>
      <div id="mfa-alert"></div>
      <input type="text" id="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" />
      <button class="btn btn-orange btn-full" onclick="submitMfaChallenge()">Verificar</button>
      <button class="btn btn-outline btn-full" style="margin-top:.5rem" onclick="cancelMfa()">Cancelar</button>
    </div>`);
  setTimeout(() => { const i = el('mfa-code'); if (i) { i.focus(); i.addEventListener('keydown', e => e.key === 'Enter' && submitMfaChallenge()); } }, 60);
}
async function submitMfaChallenge() {
  const code = (v('mfa-code') || '').replace(/\D/g, '');
  if (!/^\d{6}$/.test(code)) return showAlert('mfa-alert', 'error', '❌ Ingresá los 6 dígitos.');
  try {
    const T = window.__mfa.TotpMultiFactorGenerator;
    const hint = _mfaResolver.hints.find(h => h.factorId === T.FACTOR_ID) || _mfaResolver.hints[0];
    const assertion = T.assertionForSignIn(hint.uid, code);
    await _mfaResolver.resolveSignIn(assertion);
    _mfaResolver = null;
    closeMfaModal();   // onAuthStateChanged continúa al portal
  } catch (e) {
    showAlert('mfa-alert', 'error', '❌ Código incorrecto o vencido. Probá de nuevo.');
  }
}

// Enrolamiento forzado: el usuario debe activar 2FA para poder entrar.
async function startMfaEnrollment() {
  if (!window.__mfa) {
    // Fail-closed: el 2FA es requerido pero el módulo no cargó → NO dejamos entrar.
    openMfaModal(`<div class="mfa-box">
      <div class="accent-bar" style="margin:0 auto .8rem"></div>
      <h2>Verificación en dos pasos</h2>
      <div class="alert alert-error">No se pudo cargar el módulo de seguridad (2FA). Revisá tu conexión y recargá la página.</div>
      <button class="btn btn-orange btn-full" style="margin-top:.6rem" onclick="location.reload()">Recargar</button>
      <button class="btn btn-outline btn-full" style="margin-top:.5rem" onclick="cancelMfa()">Cerrar sesión</button>
    </div>`);
    return;
  }
  // Firebase exige el email verificado antes de enrolar un segundo factor. Los
  // usuarios creados por el admin arrancan sin verificar → los guiamos a verificar.
  const mUser = window.__mfa.auth.currentUser;
  if (mUser && mUser.emailVerified === false) { showMfaEmailVerification(mUser); return; }

  openMfaModal('<div class="mfa-box"><div class="loading">Generando código…</div></div>');
  try {
    const mfa = window.__mfa.multiFactor(window.__mfa.auth.currentUser);
    const session = await mfa.getSession();
    _mfaSecret = await window.__mfa.TotpMultiFactorGenerator.generateSecret(session);
    const otpUrl = _mfaSecret.generateQrCodeUrl(currentUser.email, 'Equipos Consultores');
    setMfaModalBody(`
      <div class="mfa-box">
        <div class="accent-bar" style="margin:0 auto .8rem"></div>
        <h2>Activá la verificación en dos pasos</h2>
        <p class="mfa-sub">Tu cuenta requiere 2FA. Escaneá el código con Google Authenticator (o similar) y luego ingresá el código de 6 dígitos.</p>
        <div id="mfa-qr" class="mfa-qr"></div>
        <p class="mfa-secret">¿No podés escanear? Clave manual: <code>${esc(_mfaSecret.secretKey)}</code></p>
        <div id="mfa-alert"></div>
        <input type="text" id="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" />
        <button class="btn btn-orange btn-full" onclick="submitMfaEnrollment()">Activar 2FA</button>
        <button class="btn btn-outline btn-full" style="margin-top:.5rem" onclick="cancelMfa()">Cerrar sesión</button>
      </div>`);
    await renderQr('mfa-qr', otpUrl);
  } catch (e) {
    // Si el backend rechaza por email sin verificar, mostramos la guía en vez del error crudo.
    if (String((e && (e.code || e.message)) || '').toLowerCase().includes('unverified-email')) {
      showMfaEmailVerification(window.__mfa.auth.currentUser); return;
    }
    setMfaModalBody(`<div class="mfa-box"><div class="alert alert-error">No se pudo iniciar la activación de 2FA: ${esc(e.message || String(e))}</div>
      <button class="btn btn-outline btn-full" style="margin-top:1rem" onclick="cancelMfa()">Cerrar sesión</button></div>`);
  }
}

// El usuario debe verificar su email antes de poder activar el 2FA. Enviamos el
// correo de verificación (una vez al entrar) y ofrecemos reenviarlo.
let _mfaVerifSent = false;
async function showMfaEmailVerification(mUser) {
  const email = (mUser && mUser.email) || (currentUser && currentUser.email) || '';
  openMfaModal(`
    <div class="mfa-box">
      <div class="accent-bar" style="margin:0 auto .8rem"></div>
      <h2>Verificá tu email</h2>
      <p class="mfa-sub">Para activar la verificación en dos pasos, primero tenés que confirmar tu correo <b>${esc(email)}</b>. Te enviamos un enlace de verificación: abrilo y volvé a iniciar sesión.</p>
      <div id="mfa-alert"></div>
      <button class="btn btn-orange btn-full" onclick="resendMfaVerification()">📧 Reenviar correo de verificación</button>
      <button class="btn btn-outline btn-full" style="margin-top:.5rem" onclick="cancelMfa()">Cerrar sesión</button>
    </div>`);
  if (!_mfaVerifSent) {
    _mfaVerifSent = true;
    try { await window.__mfa.sendEmailVerification(mUser); } catch (e) {}
  }
}
async function resendMfaVerification() {
  try {
    await window.__mfa.sendEmailVerification(window.__mfa.auth.currentUser);
    showAlert('mfa-alert', 'success', '✅ Te reenviamos el correo de verificación. Revisá tu bandeja de entrada (y la carpeta de spam).');
  } catch (e) {
    const m = String((e && (e.code || e.message)) || '').toLowerCase();
    showAlert('mfa-alert', 'error', m.includes('too-many-requests')
      ? '⚠️ Enviaste varias solicitudes. Esperá unos minutos antes de pedir otro correo.'
      : '❌ No se pudo enviar el correo: ' + (e.message || e));
  }
}
async function submitMfaEnrollment() {
  const code = (v('mfa-code') || '').replace(/\D/g, '');
  if (!/^\d{6}$/.test(code)) return showAlert('mfa-alert', 'error', '❌ Ingresá los 6 dígitos.');
  try {
    const assertion = window.__mfa.TotpMultiFactorGenerator.assertionForEnrollment(_mfaSecret, code);
    await window.__mfa.multiFactor(window.__mfa.auth.currentUser).enroll(assertion, 'App de autenticación');
    _mfaSecret = null;
    try { await db.collection('users').doc(currentUser.uid).update({ mfaEnrolled: true }); } catch (e) {}
    closeMfaModal();
    enterPortal();
  } catch (e) {
    showAlert('mfa-alert', 'error', '❌ Código incorrecto o vencido. Probá de nuevo.');
  }
}

// El modo enlace público se arranca desde boot() (necesita db ya inicializado).

// Muestra un informe compartido públicamente a partir de su token.
// Usa overlays fijos apilados sobre la página (no toca el #root ni los
// templates), de modo que funciona sin haber renderizado la app.
async function renderPublicView(token) {
  _publicMode = true;
  document.title = 'Informe compartido';
  const loading = document.createElement('div');
  loading.id = 'public-loading';
  loading.style.cssText = 'position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:#f7f7f8;color:#555;font-family:system-ui,Arial,sans-serif';
  loading.innerHTML = `<div style="text-align:center"><div style="font-size:2rem;margin-bottom:.6rem">📄</div>Cargando informe…</div>`;
  document.body.appendChild(loading);

  let data;
  try {
    const snap = await db.collection('publicLinks').doc(token).get();
    if (!snap.exists) {
      return showPublicMessage('🔒', 'Enlace no disponible',
        'Este enlace público no existe o fue desactivado por el administrador.');
    }
    data = snap.data();
    if (data.enabled === false) {
      return showPublicMessage('🔒', 'Enlace desactivado',
        'Este enlace público fue desactivado por el administrador.');
    }
  } catch (e) {
    return showPublicMessage('⚠️', 'No se pudo cargar',
      'Ocurrió un error al abrir el informe. Intentá de nuevo más tarde.');
  }
  // Registro liviano del acceso público: contador + fecha del último acceso.
  // Fire-and-forget: no bloquea la apertura del informe si falla.
  db.collection('publicLinks').doc(token).update({
    hitCount: firebase.firestore.FieldValue.increment(1),
    lastAccessAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(() => {});

  const l = document.getElementById('public-loading'); if (l) l.remove();
  // Sin marca de agua ni restricciones: es una vista pública explícita.
  await openViewer(data.url, data.name || 'Informe',
    { watermark: false, noPrint: false, noDownload: false, noCopy: false }, null, null);
}

function showPublicMessage(icon, title, text) {
  const l = document.getElementById('public-loading'); if (l) l.remove();
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding:1.5rem;font-family:system-ui,Arial,sans-serif;background:#f7f7f8';
  m.innerHTML = `<div style="max-width:440px;text-align:center;background:#fff;border:1px solid #eee;border-radius:14px;padding:2.4rem 2rem;box-shadow:0 6px 24px rgba(0,0,0,.06)">
       <div style="font-size:2.6rem;margin-bottom:.8rem">${icon}</div>
       <h1 style="font-size:1.15rem;margin:0 0 .5rem;color:#222">${esc(String(title))}</h1>
       <p style="margin:0;color:#666;font-size:.9rem;line-height:1.5">${esc(String(text))}</p>
     </div>`;
  document.body.appendChild(m);
}

async function doLogin() {
  const email = v('login-email'), pass = v('login-pass');
  clearAlert('login-alert');
  try {
    // Firmamos con el SDK modular cuando está disponible: así el error de MFA es
    // resoluble con getMultiFactorResolver (modular). El listener onAuthStateChanged
    // (compat) igual se dispara porque comparten la misma app.
    if (window.__mfa) await window.__mfa.signInWithEmailAndPassword(window.__mfa.auth, email, pass);
    else await auth.signInWithEmailAndPassword(email, pass);
  } catch (err) {
    // El usuario tiene 2FA: Firebase pide el segundo factor antes de emitir el token.
    if (err && err.code === 'auth/multi-factor-auth-required') { startMfaChallenge(err); return; }
    showAlert('login-alert', 'error', '❌ Email o contraseña incorrectos');
  }
}
async function doLogout() { await endSession(); auth.signOut(); }

// Autoservicio desde el login: el usuario pide un enlace para restablecer su
// contraseña. Firebase envía el correo (en español, ver auth.languageCode).
// Por seguridad no revelamos si el email existe o no (anti-enumeración).
async function forgotPassword() {
  const email = v('login-email');
  clearAlert('login-alert');
  if (!email) {
    return showAlert('login-alert', 'error', '✉️ Escribí tu email arriba y volvé a tocar "¿Olvidaste tu contraseña?"');
  }
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRe.test(email)) {
    return showAlert('login-alert', 'error', '❌ El email no es válido.');
  }
  try {
    await auth.sendPasswordResetEmail(email);
  } catch (err) {
    const code = (err && err.code) || '';
    // A propósito NO distinguimos "usuario no encontrado": mostramos siempre el
    // mismo mensaje para no filtrar qué correos están registrados.
    if (code === 'auth/invalid-email') {
      return showAlert('login-alert', 'error', '❌ El email no es válido.');
    }
    if (code === 'auth/too-many-requests') {
      return showAlert('login-alert', 'error', '⏳ Demasiados intentos. Esperá unos minutos e intentá de nuevo.');
    }
    // Otros errores (incluido user-not-found): caemos al mensaje neutro de éxito.
  }
  showAlert('login-alert', 'success',
    `<span>✅ Si existe una cuenta con <strong>${esc(email)}</strong>, te enviamos un correo con el enlace para elegir una contraseña nueva.<br>Revisá tu bandeja de entrada (y la carpeta de spam).</span>`);
}

/* ── RENDER ── */
function renderLogin() {
  inject('tpl-login');
  on('login-email', 'keydown', e => e.key === 'Enter' && doLogin());
  on('login-pass',  'keydown', e => e.key === 'Enter' && doLogin());
  if (_loginNotice) { showAlert('login-alert', 'error', _loginNotice); _loginNotice = null; }
}

async function renderAdmin() {
  inject('tpl-admin');
  el('admin-email').textContent  = currentUser.email;
  el('admin-avatar').textContent = currentUser.email[0].toUpperCase();
  await Promise.all([loadReports(), loadUsers(), loadFolders(), loadReportAccessCounts()]);
  renderReportsTable();
  renderUsersTable();
  renderFoldersTree();
}

async function renderUser() {
  inject('tpl-user');
  el('user-sidebar-email').textContent = currentUser.email;
  el('user-avatar').textContent        = currentUser.email[0].toUpperCase();
  await loadUserReports();
  await loadMyClientDocs();
  renderMyClientDocs();
}

/* ── TABS ── */
function switchTab(tab, btn) {
  ['reports','users','permissions','matrix','metrics-summary','metrics-sessions','metrics-dashboards','clientdocs'].forEach(t =>
    el('tab-'+t).classList.toggle('hidden', t !== tab));
  document.querySelectorAll('.nav-item').forEach(b => { b.classList.remove('active'); b.classList.remove('active-parent'); });
  if (btn) btn.classList.add('active');
  // El padre "Métricas" queda resaltado mientras se ve cualquiera de sus sub-páginas.
  const nm = el('nav-metrics'); if (nm && tab.indexOf('metrics') === 0) nm.classList.add('active-parent');
  if (tab === 'permissions') populatePermSelect();
  if (tab === 'matrix') loadMatrix();
  if (tab === 'metrics-summary' || tab === 'metrics-sessions') loadMetrics();
  if (tab === 'metrics-dashboards') loadDashboardAnalytics();
  if (tab === 'clientdocs') loadClientDocs();
}

/* ── REPORTS ── */
async function loadReports() {
  try {
    // Traemos TODOS los informes sin orderBy: Firestore excluye de una consulta
    // ordenada los documentos que no tengan el campo (por ej. informes subidos
    // antes de que existiera 'createdAt'), y así no se veían todos.
    const snap = await db.collection('reports').get();
    allReports = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // Orden por fecha de creación descendente, resuelto en el cliente.
    const ms = ts => (ts && ts.toMillis) ? ts.toMillis() : 0;
    allReports.sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
  } catch { allReports = []; }
}

// Cuenta, por informe, cuántos usuarios tienen acceso (leyendo userAccess una vez).
async function loadReportAccessCounts() {
  const counts = {};
  try {
    const snap = await db.collection('userAccess').get();
    snap.docs.forEach(d => {
      (d.data().reportIds || []).forEach(rid => { counts[rid] = (counts[rid] || 0) + 1; });
    });
  } catch { /* sin permisos / sin datos → contadores vacíos */ }
  reportAccessCounts = counts;
}

/* ── MATRIZ usuarios/informes ── */
let _matrixAccess = null;   // { uid: Set(reportIds) }
async function loadMatrix() {
  const cont = el('matrix-content'); if (!cont) return;
  cont.innerHTML = '<div class="loading">Cargando matriz...</div>';
  try {
    if (!allUsers.length)   await loadUsers();
    if (!allReports.length) await loadReports();
    const snap = await db.collection('userAccess').get();
    const access = {};
    snap.docs.forEach(d => { access[d.id] = new Set(d.data().reportIds || []); });
    _matrixAccess = access;
    renderMatrix();
  } catch (e) {
    cont.innerHTML = emptyHTML('⚠️', 'No se pudo cargar la matriz: ' + esc(e.message || String(e)));
  }
}

function renderMatrix() {
  const cont = el('matrix-content'); if (!cont || !_matrixAccess) return;
  const rf = (el('matrix-filter-report') && el('matrix-filter-report').value || '').trim().toLowerCase();
  const uf = (el('matrix-filter-user') && el('matrix-filter-user').value || '').trim().toLowerCase();
  const access = _matrixAccess;

  const allNonAdmin = allUsers.filter(u => u.role !== 'admin');
  let users = allNonAdmin
    .map(u => ({ uid: u.id, email: u.email || '' }))
    .filter(u => !uf || u.email.toLowerCase().includes(uf))
    .sort((a, b) => a.email.localeCompare(b.email, 'es', { sensitivity: 'base' }));
  let reports = allReports
    .map(r => ({ id: r.id, name: r.name || '' }))
    .filter(r => !rf || r.name.toLowerCase().includes(rf))
    .sort((a, b) => a.name.localeCompare(b.name, 'es', { sensitivity: 'base' }));

  if (!allNonAdmin.length) { cont.innerHTML = emptyHTML('👤', 'No hay usuarios (no-admin) para mostrar.'); return; }
  if (!allReports.length)  { cont.innerHTML = emptyHTML('📭', 'No hay informes para mostrar.'); return; }
  if (!users.length || !reports.length) { cont.innerHTML = emptyHTML('🔎', 'Nada coincide con los filtros.'); return; }

  const has = (uid, rid) => !!(access[uid] && access[uid].has(rid));

  const head = `<tr>
    <th class="mx-corner">Informe \\ Usuario</th>
    ${users.map(u => `<th class="mx-user" title="${esc(u.email)}"><span>${esc(u.email)}</span></th>`).join('')}
    <th class="mx-total-col" title="Usuarios con acceso a este informe">Total</th>
  </tr>`;

  const body = reports.map(r => {
    const cnt = users.reduce((n, u) => n + (has(u.uid, r.id) ? 1 : 0), 0);
    return `<tr>
      <td class="mx-name">${fileIcon(r.name)} ${esc(r.name)}</td>
      ${users.map(u => has(u.uid, r.id)
        ? `<td class="mx-cell mx-yes" title="${esc(u.email)} tiene acceso a ${esc(r.name)}">✓</td>`
        : `<td class="mx-cell mx-no">·</td>`).join('')}
      <td class="mx-total">${cnt}</td>
    </tr>`;
  }).join('');

  const foot = `<tr>
    <td class="mx-name">Informes por usuario</td>
    ${users.map(u => `<td class="mx-total">${reports.reduce((n, r) => n + (has(u.uid, r.id) ? 1 : 0), 0)}</td>`).join('')}
    <td class="mx-total"></td>
  </tr>`;

  cont.innerHTML = `<div class="matrix-wrap"><table class="matrix">
    <thead>${head}</thead>
    <tbody>${body}</tbody>
    <tfoot>${foot}</tfoot>
  </table></div>`;
}
