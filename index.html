function handleDragOver(e) { e.preventDefault(); el('upload-area').classList.add('drag'); }
function handleDragLeave()  { el('upload-area').classList.remove('drag'); }
function handleDrop(e) {
  e.preventDefault(); el('upload-area').classList.remove('drag');
  const files = [...e.dataTransfer.files];
  if (files.length) uploadFiles(files);
}
function handleFileSelect(e) {
  if (e.target.files.length) uploadFiles([...e.target.files]);
  e.target.value = '';
}

async function uploadFiles(files) {
  // Se acepta cualquier tipo de archivo. Los formatos con visor (HTML, PDF,
  // Word, PowerPoint, video) se muestran inline; el resto se ofrece para descarga.
  if (!files.length) return;

  // Carpeta destino elegida en el selector (null = raíz).
  const uploadFolderId = (el('upload-folder-select') && el('upload-folder-select').value) || null;

  el('upload-progress').classList.remove('hidden');
  const bar = el('progress-bar');
  const statusEl = el('upload-status');

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    statusEl.textContent = `Subiendo ${i+1}/${files.length}: ${file.name}`;
    statusEl.style.color = '';
    el('upload-pct').textContent = '0%';
    bar.style.width = '0%';
    bar.style.background = 'var(--orange)';

    const path = `reports/${Date.now()}_${file.name}`;
    try {
      const task = storage.ref(path).put(file, { contentType: file.type || guessContentType(file.name) });
      await new Promise((res, rej) => {
        task.on('state_changed',
          s => {
            const pct = Math.round(s.bytesTransferred / s.totalBytes * 100);
            bar.style.width = pct + '%';
            el('upload-pct').textContent = pct + '%';
          },
          err => {
            console.error('Firebase Storage upload error:', err);
            console.error('Error code:', err.code);
            console.error('Error message:', err.message);
            console.error('Server response:', err.serverResponse);
            rej(err);
          },
          async () => {
            try {
              await db.collection('reports').add({
                name: file.name, storagePath: path, size: file.size,
                ext: extOf(file.name),
                folderId: uploadFolderId,   // null = raíz
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
              res();
            } catch (e) {
              console.error('Firestore write error:', e);
              rej(e);
            }
          }
        );
      });
    } catch (err) {
      // Muestra el error al usuario con detalles concretos
      bar.style.background = '#B83A26';
      bar.style.width = '100%';
      let msg = '❌ Error al subir';
      if (err.code === 'storage/unauthorized')
        msg = '❌ Sin permisos — revisá las reglas de Storage en Firebase Console';
      else if (err.code === 'storage/canceled')
        msg = '❌ Subida cancelada';
      else if (err.code === 'storage/unknown')
        msg = '❌ Error de conexión — revisá tu "storageBucket" en firebaseConfig';
      else if (err.code === 'storage/retry-limit-exceeded')
        msg = '❌ Tiempo agotado — problema de red o CORS';
      else if (err.code === 'permission-denied')
        msg = '❌ Firestore bloqueó la escritura — revisá que seas admin';
      else if (err.code)
        msg = `❌ Error: ${err.code}`;
      else
        msg = `❌ Error: ${err.message || 'desconocido'}`;
      statusEl.textContent = msg;
      statusEl.style.color = '#B83A26';
      alert(msg + '\n\nDetalle técnico (también en consola F12):\n' + (err.code || '') + '\n' + (err.message || err));
      return; // corta el bucle
    }
  }

  statusEl.textContent = '✅ ¡Archivos subidos correctamente!';
  bar.style.width = '100%'; el('upload-pct').textContent = '100%';
  await loadReports(); renderReportsTable(); renderFoldersTree();
  setTimeout(() => el('upload-progress').classList.add('hidden'), 3000);
}

/* ── CARPETAS (organización jerárquica de informes) ── */
// Modelo: colección 'folders' { name, parentId (null = raíz), createdAt }.
// Cada informe tiene 'folderId' (null/ausente = raíz). El acceso del cliente
// sigue siendo POR INFORME; las carpetas son solo para organizar y navegar.

async function loadFolders() {
  try {
    const snap = await db.collection('folders').get();
    allFolders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch { allFolders = []; }
}

function folderById(id) { return allFolders.find(f => f.id === id) || null; }

// ¿La carpeta es visible para los clientes? Por defecto sí (clientVisible ausente
// o distinto de false). Si es false, el cliente no ve la carpeta en sí: ve su
// contenido "promovido" a la carpeta visible más cercana hacia arriba (o a la raíz).
function isClientVisibleFolder(f) { return !f || f.clientVisible !== false; }

// Dada una carpeta (por id) devuelve la carpeta visible más cercana en la cadena
// [ella misma, su padre, su abuelo, …]. Si ninguna es visible, devuelve null (raíz).
// Se usa en la vista del cliente para "saltear" las carpetas ocultas.
function nearestVisibleFolderFrom(folderId) {
  let cur = folderId ? folderById(folderId) : null;
  const seen = new Set();
  while (cur && !seen.has(cur.id)) {
    seen.add(cur.id);
    if (isClientVisibleFolder(cur)) return cur.id;
    cur = cur.parentId ? folderById(cur.parentId) : null;
  }
  return null; // raíz
}

function childFolders(parentId) {
  return allFolders
    .filter(f => (f.parentId || null) === (parentId || null))
    .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'es'));
}

// Carpetas en orden de árbol (padre antes que hijos), con su profundidad.
function foldersInTreeOrder(parentId = null, depth = 0, out = []) {
  childFolders(parentId).forEach(f => {
    out.push({ folder: f, depth });
    foldersInTreeOrder(f.id, depth + 1, out);
  });
  return out;
}

// <option>s indentados para los selectores de carpeta.
function folderOptionsHTML(selectedId) {
  const sel = selectedId || '';
  let html = `<option value="" ${sel === '' ? 'selected' : ''}>— Raíz —</option>`;
  foldersInTreeOrder().forEach(({ folder, depth }) => {
    const pad = '  '.repeat(depth);
    html += `<option value="${folder.id}" ${sel === folder.id ? 'selected' : ''}>${pad}📁 ${esc(folder.name)}</option>`;
  });
  return html;
}

function refreshFolderSelectors() {
  ['upload-folder-select', 'new-folder-parent', 'reports-folder-filter'].forEach(id => {
    const s = el(id);
    if (s) { const prev = s.value; s.innerHTML = folderOptionsHTML(prev); }
  });
}

// ¿candidateId es la propia carpeta ancestorId o una de sus descendientes?
// Sirve para no permitir mover una carpeta dentro de sí misma o de su subárbol.
function isDescendantFolder(candidateId, ancestorId) {
  let cur = candidateId ? folderById(candidateId) : null;
  const guard = new Set();
  while (cur && !guard.has(cur.id)) {
    if (cur.id === ancestorId) return true;
    guard.add(cur.id);
    cur = cur.parentId ? folderById(cur.parentId) : null;
  }
  return false;
}

// <option>s para "mover carpeta": marca el padre actual como seleccionado y
// deshabilita los destinos inválidos (la propia carpeta y sus descendientes).
function folderMoveOptionsHTML(movingId, currentParentId) {
  const cur = currentParentId || '';
  let html = `<option value="" ${cur === '' ? 'selected' : ''}>— Raíz —</option>`;
  foldersInTreeOrder().forEach(({ folder, depth }) => {
    const pad = '  '.repeat(depth);
    const invalid = isDescendantFolder(folder.id, movingId);
    html += `<option value="${folder.id}" ${cur === folder.id ? 'selected' : ''} ${invalid ? 'disabled' : ''}>${pad}📁 ${esc(folder.name)}</option>`;
  });
  return html;
}

function reportCountInFolder(folderId) {
  return allReports.filter(r => (r.folderId || null) === folderId).length;
}

// Ruta (de la raíz a la carpeta dada) para el breadcrumb de la lista de informes.
function folderPath(folderId) {
  const path = [];
  const guard = new Set();
  let cur = folderId ? folderById(folderId) : null;
  while (cur && !guard.has(cur.id)) { guard.add(cur.id); path.unshift(cur); cur = cur.parentId ? folderById(cur.parentId) : null; }
  return path;
}

// Cambia el filtro de carpeta de la lista de informes y re-renderiza.
function setReportsFolderFilter(folderId) {
  const s = el('reports-folder-filter');
  if (s) s.value = folderId || '';
  renderReportsTable();
}

function renderFoldersTree() {
  const cnt = el('folders-count');
  if (cnt) cnt.textContent = allFolders.length;
  refreshFolderSelectors();
  const box = el('folders-tree');
  if (!box) return;
  const rows = foldersInTreeOrder();
  if (!rows.length) {
    box.innerHTML = `<div class="folder-tree-empty">Todavía no hay carpetas. Creá una arriba.</div>`;
    return;
  }
  box.innerHTML = rows.map(({ folder, depth }) => {
    const n = reportCountInFolder(folder.id);
    const subs = childFolders(folder.id).length;
    const meta = [];
    if (subs) meta.push(`${subs} ${subs === 1 ? 'subcarpeta' : 'subcarpetas'}`);
    meta.push(`${n} ${n === 1 ? 'informe' : 'informes'}`);
    const visible = isClientVisibleFolder(folder);
    const visBtn = visible
      ? `<button class="btn btn-outline btn-sm" title="Los clientes ven esta carpeta. Clic para ocultarla (verían su contenido un nivel arriba)." onclick="toggleFolderVisible('${folder.id}')">👁 Visible</button>`
      : `<button class="btn btn-outline btn-sm" style="opacity:.7" title="Oculta para clientes: no ven la carpeta, sino su contenido un nivel arriba. Clic para hacerla visible." onclick="toggleFolderVisible('${folder.id}')">🙈 Oculta</button>`;
    const hiddenTag = visible ? '' :
      `<span style="color:var(--gray);font-size:.72rem;font-weight:600;white-space:nowrap;background:var(--gray-xlight);border-radius:6px;padding:.1rem .4rem">oculta a clientes</span>`;
    return `
      <div class="folder-tree-row">
        <div class="ftree-name">
          <span style="width:${depth * 22}px;flex:0 0 auto"></span>
          <span class="fname" style="${visible ? '' : 'opacity:.65'}">${visible ? '📁' : '🗂️'} ${esc(folder.name)}</span>
          ${hiddenTag}
          <span style="color:var(--gray);font-size:.78rem;font-weight:500;white-space:nowrap">· ${meta.join(' · ')}</span>
        </div>
        <label class="ftree-move">Mover a:</label>
        <select class="fselect" style="width:230px;flex:0 0 auto;font-size:.8rem;padding:.4rem .5rem" onchange="moveFolder('${folder.id}', this.value)">${folderMoveOptionsHTML(folder.id, folder.parentId || '')}</select>
        <span style="flex:1"></span>
        ${visBtn}
        <button class="btn btn-outline btn-sm" onclick="renameFolder('${folder.id}')">✏️ Renombrar</button>
        <button class="btn btn-danger btn-sm" onclick="deleteFolder('${folder.id}')">🗑</button>
      </div>`;
  }).join('');
}

// Alterna la visibilidad de una carpeta para los clientes (clientVisible).
async function toggleFolderVisible(id) {
  const f = folderById(id); if (!f) return;
  const next = !isClientVisibleFolder(f);   // nuevo estado deseado
  try {
    await db.collection('folders').doc(id).update({ clientVisible: next });
    f.clientVisible = next;   // refleja el cambio en memoria
    renderFoldersTree();
  } catch (e) {
    alert('No se pudo cambiar la visibilidad: ' + (e.message || e));
  }
}

async function createFolder() {
  const name = v('new-folder-name');
  const parentId = v('new-folder-parent') || null;
  const visChk = el('new-folder-visible');
  const clientVisible = visChk ? visChk.checked : true;
  if (!name) return alert('Escribí un nombre para la carpeta.');
  try {
    await db.collection('folders').add({
      name, parentId, clientVisible,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    el('new-folder-name').value = '';
    if (visChk) visChk.checked = true;   // vuelve al valor por defecto
    await loadFolders();
    renderFoldersTree();
    renderReportsTable();   // refresca los selectores de carpeta por fila
  } catch (e) {
    alert('No se pudo crear la carpeta: ' + (e.message || e));
  }
}

// Cambia la carpeta padre de una carpeta (mover en el árbol).
async function moveFolder(id, newParentId) {
  const target = newParentId || null;
  const f = folderById(id); if (!f) return;
  if ((f.parentId || null) === target) return;   // sin cambios
  if (target && isDescendantFolder(target, id)) {
    alert('No se puede mover una carpeta dentro de sí misma ni de una de sus subcarpetas.');
    renderFoldersTree();   // revierte el selector al valor real
    return;
  }
  try {
    await db.collection('folders').doc(id).update({ parentId: target });
    await loadFolders();
    renderFoldersTree();
    renderReportsTable();   // refresca navegación/filtros de la lista de informes
  } catch (e) {
    alert('No se pudo mover la carpeta: ' + (e.message || e));
    renderFoldersTree();
  }
}

async function renameFolder(id) {
  const f = folderById(id); if (!f) return;
  const name = prompt('Nuevo nombre de la carpeta:', f.name || '');
  if (name == null) return;
  const clean = name.trim();
  if (!clean) return alert('El nombre no puede quedar vacío.');
  try {
    await db.collection('folders').doc(id).update({ name: clean });
    await loadFolders();
    renderFoldersTree();
    renderReportsTable();
  } catch (e) {
    alert('No se pudo renombrar: ' + (e.message || e));
  }
}

async function deleteFolder(id) {
  const f = folderById(id); if (!f) return;
  const subs = childFolders(id);
  const reps = allReports.filter(r => (r.folderId || null) === id);
  const parentId = f.parentId || null;
  const parentName = parentId ? (folderById(parentId) ? folderById(parentId).name : 'la carpeta padre') : 'la raíz';
  let msg = `¿Borrar la carpeta "${f.name}"?`;
  if (subs.length || reps.length) {
    msg += `\n\nSu contenido (${subs.length} subcarpeta(s) y ${reps.length} informe(s)) se moverá a ${parentName}.`;
  }
  msg += `\n\nNo se borra ningún informe.`;
  if (!confirm(msg)) return;
  try {
    const batch = db.batch();
    subs.forEach(s => batch.update(db.collection('folders').doc(s.id), { parentId: parentId }));
    reps.forEach(r => batch.update(db.collection('reports').doc(r.id),
      { folderId: parentId === null ? firebase.firestore.FieldValue.delete() : parentId }));
    batch.delete(db.collection('folders').doc(id));
    await batch.commit();
    await Promise.all([loadFolders(), loadReports()]);
    renderFoldersTree();
    renderReportsTable();
  } catch (e) {
    alert('No se pudo borrar la carpeta: ' + (e.message || e));
  }
}

async function moveReport(reportId, folderId) {
  const target = folderId || null;
  try {
    await db.collection('reports').doc(reportId).update({
      folderId: target === null ? firebase.firestore.FieldValue.delete() : target
    });
    const r = allReports.find(x => x.id === reportId);
    if (r) { if (target === null) delete r.folderId; else r.folderId = target; }
    renderFoldersTree();   // actualiza los contadores por carpeta
    renderReportsTable();  // el archivo movido sale de la vista de la carpeta actual
  } catch (e) {
    alert('No se pudo mover el informe: ' + (e.message || e));
    renderReportsTable();  // revierte el selector al valor real
  }
}

// ── Reescribir (sobrescribir) el contenido de un informe ya cargado ──
// Sube un archivo nuevo a la MISMA ruta de Storage, así se conserva el mismo
// informe (su ID) y con él sus permisos, accesos y enlace público. Mismo
// criterio que scripts/update_report.py, pero desde el panel del admin.
let _overwriteTarget = null;

function startOverwrite(reportId, storagePath, name) {
  _overwriteTarget = { reportId, storagePath, name, ext: extOf(name) };
  const inp = el('overwrite-input');
  if (inp) { inp.value = ''; inp.click(); }
}

function handleOverwriteSelect(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (file && _overwriteTarget) overwriteReport(_overwriteTarget, file);
}

async function overwriteReport(target, file) {
  // Debe ser del mismo tipo que el informe original: el visor decide cómo
  // renderizar según la extensión del nombre, que no cambia al reescribir.
  // Para cambiar de formato, hay que borrar el informe y subir uno nuevo.
  if (extOf(file.name) !== target.ext) {
    return alert(`El archivo nuevo debe ser del mismo tipo (.${target.ext}) que el informe actual.\n\n` +
      `Para cambiar el formato, borrá el informe y subí uno nuevo.`);
  }
  const rep = allReports.find(x => x.id === target.reportId) || {};
  if (!confirm(
    `¿Reescribir el informe "${target.name}" con el archivo "${file.name}"?\n\n` +
    `Se reemplaza el contenido, pero se conservan el mismo informe, sus permisos, ` +
    `accesos y el enlace público (si tiene).\n\nEsta acción no se puede deshacer.`)) return;

  el('upload-progress').classList.remove('hidden');
  const bar = el('progress-bar'), statusEl = el('upload-status');
  statusEl.textContent = `Reescribiendo: ${target.name}`;
  statusEl.style.color = '';
  el('upload-pct').textContent = '0%';
  bar.style.width = '0%'; bar.style.background = 'var(--orange)';

  try {
    const task = storage.ref(target.storagePath).put(file, { contentType: file.type || guessContentType(file.name) });
    await new Promise((res, rej) => {
      task.on('state_changed',
        s => {
          const pct = Math.round(s.bytesTransferred / s.totalBytes * 100);
          bar.style.width = pct + '%'; el('upload-pct').textContent = pct + '%';
        },
        err => { console.error('Overwrite upload error:', err); rej(err); },
        () => res()
      );
    });

    // Metadata: nuevo tamaño + marca de última reescritura.
    await db.collection('reports').doc(target.reportId).update({
      size: file.size,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Si tiene enlace público, refrescamos su URL: al sobrescribir, Storage
    // genera un token de descarga nuevo y la URL guardada deja de servir.
    if (rep.publicToken) {
      try {
        const newUrl = await storage.ref(target.storagePath).getDownloadURL();
        await db.collection('publicLinks').doc(rep.publicToken).update({ url: newUrl });
      } catch (e2) {
        console.error('No se pudo refrescar el enlace público:', e2);
        alert('El informe se reescribió, pero no se pudo refrescar el enlace público automáticamente.\n\n' +
          'Abrí "Link público" del informe y regeneralo para que apunte al contenido nuevo.');
      }
    }

    statusEl.textContent = `✅ "${target.name}" reescrito correctamente`;
    bar.style.width = '100%'; el('upload-pct').textContent = '100%';
    await loadReports(); renderReportsTable();
    setTimeout(() => el('upload-progress').classList.add('hidden'), 3000);
  } catch (err) {
    bar.style.background = '#B83A26'; bar.style.width = '100%';
    let msg = '❌ Error al reescribir';
    if (err.code === 'storage/unauthorized')   msg = '❌ Sin permisos — revisá las reglas de Storage en Firebase Console';
    else if (err.code === 'permission-denied') msg = '❌ Firestore bloqueó la escritura — revisá que seas admin';
    else if (err.code)                         msg = `❌ Error: ${err.code}`;
    else                                       msg = `❌ Error: ${err.message || 'desconocido'}`;
    statusEl.textContent = msg; statusEl.style.color = '#B83A26';
    alert(msg + '\n\nDetalle técnico (también en consola F12):\n' + (err.code || '') + '\n' + (err.message || err));
  } finally {
    _overwriteTarget = null;
  }
}

async function deleteReport(id, storagePath) {
  if (!confirm('¿Eliminar este informe? Esta acción no se puede deshacer.')) return;
  try { await storage.ref(storagePath).delete(); } catch {}
  // Si tenía un enlace público, lo desactivamos también.
  const rep = allReports.find(x => x.id === id);
  if (rep && rep.publicToken) {
    try { await db.collection('publicLinks').doc(rep.publicToken).delete(); } catch {}
  }
  await db.collection('reports').doc(id).delete();
  const snap = await db.collection('userAccess').get();
  const batch = db.batch();
  snap.docs.forEach(d => {
    const data = d.data();
    const hasAccess = data.reportIds?.includes(id);
    const hasOpts   = data.options && Object.prototype.hasOwnProperty.call(data.options, id);
    if (hasAccess || hasOpts) {
      const upd = {};
      if (hasAccess) upd.reportIds = data.reportIds.filter(r => r !== id);
      if (hasOpts)   upd['options.' + id] = firebase.firestore.FieldValue.delete();
      batch.update(d.ref, upd);
    }
  });
  await batch.commit();
  await loadReports(); renderReportsTable();
}

// Descarga el contenido de una URL con el nombre indicado. La URL de Storage es
// de otro origen (el atributo download no renombra cross-origin), así que bajamos
// el contenido como blob y usamos un object URL, que sí respeta el nombre. Requiere
// el CORS del bucket ya configurado (el mismo que usa el visor). Si falla el fetch
// (p.ej. CORS), abre la URL directamente como último recurso.
async function downloadBlobUrl(url, name) {
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const blob = await resp.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl;
    a.download = name || 'archivo';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
  } catch (err) {
    // Sin CORS no se puede leer el blob: abrimos la URL (el navegador la descarga
    // si el content-type es octet-stream, o la muestra en una pestaña nueva).
    window.open(url, '_blank', 'noopener');
  }
}
// Descarga un informe/documento por su ruta de Storage, con su nombre original.
async function downloadReport(storagePath, name) {
  showLoadingOverlay(name);
  try {
    const url = await storage.ref(storagePath).getDownloadURL();
    await downloadBlobUrl(url, name);
  } catch (err) {
    alert('Error al descargar el informe: ' + (err.message || err));
  } finally {
    hideLoadingOverlay();
  }
}

/* ── ENLACES PÚBLICOS ── */
// Token aleatorio para la URL pública (no adivinable).
function randomToken() {
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
}
function publicLinkUrl(token) { return `${location.origin}/?p=${token}`; }

// Abre el diálogo de gestión del enlace público de un informe.
async function managePublicLink(reportId, storagePath, name) {
  const r = allReports.find(x => x.id === reportId) || {};
  const token = r.publicToken || null;
  openLinkModal(publicLinkModalBody(reportId, storagePath, name, token));
  if (token) {
    try {
      const snap = await db.collection('publicLinks').doc(token).get();
      const d = snap.exists ? snap.data() : {};
      fillLinkStats(d.hitCount, d.lastAccessAt);
    } catch { fillLinkStats(0, null); }
  }
}

// Rellena el bloque de estadísticas del diálogo (accesos + último acceso).
function fillLinkStats(count, lastAccessTs) {
  const box = el('public-link-stats'); if (!box) return;
  const n = count || 0;
  const last = lastAccessTs ? fmtDateTime(tsMs(lastAccessTs)) : '—';
  box.innerHTML = `👁 <b>${n}</b> ${n === 1 ? 'acceso' : 'accesos'} · último: ${last}`;
}

function publicLinkModalBody(reportId, storagePath, name, token) {
  if (token) {
    const url = publicLinkUrl(token);
    return `
      <p style="font-size:.85rem;color:var(--gray);font-weight:500;margin:0 0 .85rem">
        Cualquier persona con este enlace puede ver <b>${esc(name)}</b> desde cualquier navegador, sin iniciar sesión.
      </p>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
        <input id="public-link-input" type="text" readonly value="${esc(url)}"
          onclick="this.select()"
          style="flex:1;min-width:220px;padding:.55rem .7rem;border:1px solid #ddd;border-radius:8px;font-size:.82rem" />
        <button class="btn btn-orange btn-sm" onclick="copyPublicLink()">📋 Copiar</button>
        <a class="btn btn-outline btn-sm" href="${esc(url)}" target="_blank" rel="noopener">↗ Abrir</a>
      </div>
      <div id="public-link-stats" style="margin-top:.9rem;font-size:.82rem;color:var(--gray);font-weight:500">
        Cargando estadísticas…
      </div>
      <div style="margin-top:1.1rem;border-top:1px solid #eee;padding-top:.9rem">
        <button class="btn btn-danger btn-sm" onclick="revokePublicLink('${reportId}')">🚫 Desactivar enlace</button>
      </div>`;
  }
  return `
    <p style="font-size:.85rem;color:var(--gray);font-weight:500;margin:0 0 1rem">
      Generá un enlace público para <b>${esc(name)}</b>. Cualquier persona con el enlace
      podrá verlo desde cualquier navegador, <b>sin iniciar sesión</b>.
    </p>
    <button class="btn btn-orange" onclick="generatePublicLink('${reportId}','${storagePath}','${esc(name)}')">🔗 Generar enlace público</button>`;
}

async function generatePublicLink(reportId, storagePath, name) {
  setLinkModalBody('<div class="loading">Generando enlace…</div>');
  try {
    // La URL de descarga de Storage ya es pública (lleva su propio token), por lo
    // que sirve para verlo sin login. La guardamos en el doc del enlace.
    const url = await storage.ref(storagePath).getDownloadURL();
    const token = randomToken();
    await db.collection('publicLinks').doc(token).set({
      reportId, name, url, enabled: true, hitCount: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('reports').doc(reportId).update({ publicToken: token });
    const r = allReports.find(x => x.id === reportId); if (r) r.publicToken = token;
    renderReportsTable();
    setLinkModalBody(publicLinkModalBody(reportId, storagePath, name, token));
    fillLinkStats(0, null);
  } catch (e) {
    setLinkModalBody(`<div class="alert alert-error">❌ No se pudo generar el enlace: ${esc(e.message || String(e))}</div>`);
  }
}

async function revokePublicLink(reportId) {
  if (!confirm('¿Desactivar el enlace público? Dejará de funcionar para todos los que lo tengan.')) return;
  const r = allReports.find(x => x.id === reportId) || {};
  const token = r.publicToken;
  try {
    if (token) { try { await db.collection('publicLinks').doc(token).delete(); } catch {} }
    await db.collection('reports').doc(reportId).update({ publicToken: firebase.firestore.FieldValue.delete() });
    if (r) delete r.publicToken;
    renderReportsTable();
    closeLinkModal();
  } catch (e) {
    alert('No se pudo desactivar el enlace: ' + (e.message || e));
  }
}

function copyPublicLink() {
  const inp = el('public-link-input'); if (!inp) return;
  inp.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(inp.value).catch(() => { try { document.execCommand('copy'); } catch {} });
  } else {
    try { document.execCommand('copy'); } catch {}
  }
}

// Rebuild solo la lista + contador (no el input) para no perder el foco al filtrar.
function renderReportUsersList() {
  const st = _reportUsersModal; if (!st) return;

  // Primero los que tienen acceso (checkbox marcado), luego por email. El orden se

  const list = st.users

async function toggleReportUser(uid, grant, cb) {
  const st = _reportUsersModal; if (!st) return;
  if (cb) cb.disabled = true;
  try {
    const options = await grantReportToUser(uid, st.reportId, grant);
    const u = st.users.find(x => x.uid === uid);
    if (u) { u.has = grant; if (grant) u.opts = options[st.reportId] || {}; }
    // Mostrar/ocultar las opciones de permisos de ese usuario en el momento
    // (sin reordenar la lista, para no perder el punto donde estás).
    const box = el('uopts-' + uid);
    if (box) {
      if (grant) { box.innerHTML = reportUserOptsHTML(uid, st.reportId, (u && u.opts) || {}); box.classList.remove('hidden'); }
      else { box.innerHTML = ''; box.classList.add('hidden'); }
    }
    const cnt = el('report-users-count');
    if (cnt) {
      const granted = st.users.filter(x => x.has).length;
      cnt.textContent = `${granted} con acceso · ${st.users.length} ${st.users.length === 1 ? 'usuario' : 'usuarios'}`;
    }
    // Mantener el badge de la lista de informes en sincronía.
    reportAccessCounts[st.reportId] = Math.max(0, (reportAccessCounts[st.reportId] || 0) + (grant ? 1 : -1));
    renderReportsTable();
  } catch (e) {
    alert('No se pudo actualizar el acceso: ' + (e.message || e));
    if (cb) cb.checked = !grant;   // revertir el toggle
  } finally {
    if (cb) cb.disabled = false;
  }
}

    const box = el('uopts-' + uid);   // refrescar solo ese bloque (para mostrar/ocultar el ✕)
    if (box) box.innerHTML = reportUserOptsHTML(uid, reportId, (u && u.opts) || {});
  } catch (e) {
    alert('No se pudo guardar la caducidad: ' + (e.message || e));
  }
}

function paramRowHTML(k, v) {

function addParamRow() {

async function saveUserParams(uid) {
  const rows = [...document.querySelectorAll('#params-rows .param-row')];
  const params = {};
  const dupes = new Set(); let hasDupe = false;
  rows.forEach(r => {
    const k = r.querySelector('.param-key').value.trim();
    const v = r.querySelector('.param-val').value.trim();
    if (!k) return;
    if (Object.prototype.hasOwnProperty.call(params, k)) { hasDupe = true; dupes.add(k); }
    params[k] = v;
  });
  if (hasDupe) {
    const a = el('params-alert');
    if (a) a.innerHTML = `<div class="alert alert-error">❌ Hay claves repetidas: ${esc([...dupes].join(', '))}. Cada clave debe ser única.</div>`;
    return;
  }
  try {
    await db.collection('users').doc(uid).update({ params });
    const u = allUsers.find(x => x.id === uid); if (u) u.params = params;
    closeParamsModal();
  } catch (e) {
    const a = el('params-alert');
    if (a) a.innerHTML = `<div class="alert alert-error">❌ No se pudo guardar: ${esc(e.message || String(e))}</div>`;
  }
}

/* ── USERS ── */
async function loadUsers() {
  try {
    // Traemos TODOS los usuarios sin orderBy: Firestore excluye de una consulta
    // ordenada los documentos que no tengan el campo (por ej. usuarios creados
    // antes de que existiera 'createdAt'), y así no se veían todos.
    const snap = await db.collection('users').get();
    allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // Orden por fecha de creación descendente, resuelto en el cliente.
    const ms = ts => (ts && ts.toMillis) ? ts.toMillis() : 0;
    allUsers.sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
  } catch { allUsers = []; }
}

// Dominio del email (parte después de la @), en minúsculas.
function emailDomain(email) {
  const e = String(email || ''); const i = e.lastIndexOf('@');
  return i >= 0 ? e.slice(i + 1).toLowerCase() : '';
}

// Repuebla el combobox de filtro por dominio con los valores existentes,
// preservando la selección actual.
function refreshDomainFilter(selected) {
  const s = el('users-domain-filter'); if (!s) return;
  const domains = [...new Set(allUsers.map(u => emailDomain(u.email)).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
  const sel = selected || '';
  s.innerHTML = `<option value="">— Todos los dominios —</option>` +
    domains.map(d => `<option value="${esc(d)}" ${sel === d ? 'selected' : ''}>${esc(d)}</option>`).join('');
}

          const mfaLabel = u.mfaRequired ? (u.mfaEnrolled ? '🔒 2FA activa' : '🔒 2FA (pendiente)') : '🔓 2FA: no';
          const mfaBtn = `<button class="btn btn-outline btn-sm" onclick="toggle2FA('${u.id}','${esc(u.email)}',${u.mfaRequired ? 'false' : 'true'})" title="Verificación en dos pasos">${mfaLabel}</button>`;
          const delBtn = isSelf ? '' :
            `<button class="btn btn-danger btn-sm" onclick="deleteUser('${u.id}','${esc(u.email)}')">🗑 Borrar</button>`;
          return `
        <tr>
          <td style="font-weight:600">${esc(u.email)}</td>

// Exigir (o no) verificación en dos pasos a un usuario. El enforcement real lo
// hace Firebase una vez que el usuario enrola; este flag fuerza ese enrolamiento.
async function toggle2FA(uid, email, on) {
  const msg = on
    ? `¿Exigir verificación en dos pasos (2FA) a "${email}"?\n\nEn su próximo ingreso deberá configurar una app de autenticación (Google Authenticator o similar).`
    : `¿Dejar de exigir 2FA a "${email}"?\n\nNota: si el usuario ya la activó, Firebase seguirá pidiéndole el código hasta que él la desactive o se quite desde Firebase Console → Authentication.`;
  if (!confirm(msg)) return;
  try {
    await db.collection('users').doc(uid).update({ mfaRequired: on });
    await loadUsers();
    renderUsersTable();
  } catch (e) {
    alert('No se pudo cambiar el 2FA: ' + (e.message || e));
  }
}

async function changeRole(uid, email, newRole) {
  if (currentUser && uid === currentUser.uid && newRole !== 'admin') {
    alert('No podés quitarte el rol de admin a vos mismo.');
    return;
  }
  const msg = newRole === 'admin'
    ? `¿Convertir a "${email}" en ADMINISTRADOR?\n\nUn admin puede ver y administrar todos los informes, usuarios y métricas.`
    : `¿Quitarle el rol de admin a "${email}" y dejarlo como usuario común?`;
  if (!confirm(msg)) return;
  try {
    await db.collection('users').doc(uid).update({ role: newRole });
    await loadUsers();
    renderUsersTable();
    populatePermSelect();   // el selector de permisos lista solo usuarios no-admin
  } catch (e) {
    alert('No se pudo cambiar el rol: ' + (e.message || e));

// Crea la cuenta de autenticación (sin cerrar la sesión del admin, gracias a
// returnSecureToken:false) y su documento en Firestore. Reutilizado por la
// creación individual y por la importación masiva.
async function provisionUser(email, pass) {
  const res = await fetch(
    `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${firebaseConfig.apiKey}`,
    { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password: pass, returnSecureToken: false }) }
  );
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  await db.collection('users').doc(data.localId).set({
    email, role: 'user',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  return data.localId;
}

async function createUser() {
  const email = v('new-user-email'), pass = v('new-user-pass');
  clearAlert('user-create-alert');
  if (!email || !pass)  return showAlert('user-create-alert','error','❌ Completá todos los campos');
  if (pass.length < 6)  return showAlert('user-create-alert','error','❌ La contraseña debe tener al menos 6 caracteres');
  try {
    await provisionUser(email, pass);
    showAlert('user-create-alert','success',`✅ Usuario "${email}" creado correctamente`);
    el('new-user-email').value = '';
    el('new-user-pass').value  = '';
    await loadUsers(); renderUsersTable(); populatePermSelect();
  } catch (err) {
    const msg = String(err.message || err).includes('EMAIL_EXISTS') ? 'Ya existe un usuario con ese email' : 'Error al crear el usuario';
    showAlert('user-create-alert','error','❌ ' + msg);
  }
}

// Carga SheetJS bajo demanda (solo cuando el admin importa un archivo).
let _xlsxLoader = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (_xlsxLoader) return _xlsxLoader;
  _xlsxLoader = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload  = () => window.XLSX ? resolve(window.XLSX) : reject(new Error('No se pudo cargar la librería de Excel'));
    s.onerror = () => { _xlsxLoader = null; reject(new Error('No se pudo descargar la librería para leer Excel (revisá tu conexión)')); };
    document.head.appendChild(s);
  });
  return _xlsxLoader;
}

async function importUsers() {
  clearAlert('user-import-alert');
  const fileInput = el('user-import-file');
  const file = fileInput && fileInput.files && fileInput.files[0];
  if (!file) return showAlert('user-import-alert','error','❌ Elegí un archivo primero');

  const btn = el('user-import-btn');
  const prog = el('user-import-progress');
  btn.disabled = true;
  prog.classList.remove('hidden');
  prog.innerHTML = '<div class="loading">Leyendo archivo...</div>';

  // 1) Leer y parsear el archivo → array de filas
  let rows;
  try {
    const XLSX = await loadXLSX();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: '' });
  } catch (e) {
    btn.disabled = false; prog.classList.add('hidden');
    return showAlert('user-import-alert','error','❌ ' + (e.message || 'No se pudo leer el archivo'));
  }

  // 2) Extraer pares email / contraseña (col 1 y col 2), omitiendo encabezado
  const pairs = [];
  (rows || []).forEach(r => {
    if (!r || !r.length) return;
    const email = String(r[0] ?? '').trim();
    const pass  = String(r[1] ?? '').trim();
    if (!email) return;
    if (/^(e-?mail|correo)/i.test(email)) return;   // fila de encabezado
    pairs.push({ email, pass });
  });

  if (!pairs.length) {
    btn.disabled = false; prog.classList.add('hidden');
    return showAlert('user-import-alert','error','❌ No se encontraron datos. Verificá que el email esté en la 1ª columna y la contraseña en la 2ª.');
  }

  // 3) Crear cada usuario, de a uno, con reporte de resultados
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const ok = [], exists = [], invalid = [], errored = [];
  for (let i = 0; i < pairs.length; i++) {
    const { email, pass } = pairs[i];
    prog.innerHTML = `<div class="loading">Procesando ${i + 1} de ${pairs.length}: ${esc(email)}...</div>`;
    if (!emailRe.test(email))     { invalid.push(`${email} — email inválido`); continue; }
    if (pass.length < 6)          { invalid.push(`${email} — contraseña de menos de 6 caracteres`); continue; }
    try {
      await provisionUser(email, pass);
      ok.push(email);
    } catch (err) {
      const m = String(err.message || err);
      if (m.includes('EMAIL_EXISTS'))        exists.push(email);
      else if (m.includes('INVALID_EMAIL'))  invalid.push(`${email} — email inválido`);
      else if (m.includes('WEAK_PASSWORD'))  invalid.push(`${email} — contraseña débil`);
      else                                   errored.push(`${email} — ${m}`);
    }
  }

  await loadUsers(); renderUsersTable(); populatePermSelect();
  fileInput.value = '';
  prog.classList.add('hidden');
  btn.disabled = false;

  // 4) Resumen
  let html = `<strong>Importación finalizada.</strong><br>✅ Creados: ${ok.length} de ${pairs.length}`;
  if (exists.length)  html += `<br>⏭ Ya existían (${exists.length}): ${esc(exists.join(', '))}`;
  if (invalid.length) html += `<br>⚠ Omitidos (${invalid.length}): ${esc(invalid.join(', '))}`;
  if (errored.length) html += `<br>❌ Errores (${errored.length}): ${esc(errored.join(', '))}`;
  showAlert('user-import-alert', ok.length ? 'success' : 'error', html);
}

async function resetUserPassword(email) {
  if (!confirm(`¿Enviar un correo para restablecer la contraseña de "${email}"?\n\nEl usuario recibirá un enlace por email para elegir una contraseña nueva.`)) return;
  try {
    await auth.sendPasswordResetEmail(email);
    alert(`✅ Se envió a "${email}" un correo con el enlace para restablecer su contraseña.\n\nRevisá también la carpeta de spam si no llega en unos minutos.`);
  } catch (err) {
    const code = (err && err.code) || '';
    let msg = err.message || err;
    if (code === 'auth/user-not-found')  msg = 'No existe una cuenta de autenticación con ese email.';
    if (code === 'auth/invalid-email')   msg = 'El email no es válido.';
    if (code === 'auth/too-many-requests') msg = 'Demasiados intentos. Esperá unos minutos e intentá de nuevo.';
    alert('❌ No se pudo enviar el correo de restablecimiento: ' + msg);
  }
}

async function deleteUser(uid, email) {
  if (currentUser && uid === currentUser.uid) { alert('No podés borrarte a vos mismo.'); return; }
  const msg = `¿Borrar al usuario "${email}"?\n\n` +
    `Se eliminará su registro y todos sus permisos de acceso a informes. No podrá volver a ingresar al portal.\n\n` +
    `⚠ Su credencial (email/contraseña) queda en Firebase Authentication. Para eliminarla por completo — y poder reutilizar ese email — borrala también en Firebase Console → Authentication.\n\n` +
    `Esta acción no se puede deshacer.`;

    await db.collection('userAccess').doc(uid).delete().catch(() => {});
    await db.collection('users').doc(uid).delete();

// Da o quita el acceso de un usuario a un informe (colección userAccess).
// Al conceder, inicializa las protecciones por defecto. Usado tanto por la
// pestaña Permisos (por usuario) como por el diálogo "Usuarios" (por informe).
async function grantReportToUser(userId, reportId, grant) {
  const snap = await db.collection('userAccess').doc(userId).get();
  const data = snap.exists ? snap.data() : {};
  let ids = data.reportIds || [];
  const options = data.options || {};
  if (grant) {
    if (!ids.includes(reportId)) ids.push(reportId);
    if (!options[reportId]) options[reportId] = Object.assign({}, DEFAULT_OPTS);
  } else {
    ids = ids.filter(x => x !== reportId);
  }
  await db.collection('userAccess').doc(userId).set({ reportIds: ids, options }, { merge: true });
  return options;
}

async function togglePerm(userId, reportId, cb) {
  const on = cb.checked;
  const options = await grantReportToUser(userId, reportId, on);
  // Mantener el badge de "usuarios con acceso" de la lista de informes.
  reportAccessCounts[reportId] = Math.max(0, (reportAccessCounts[reportId] || 0) + (on ? 1 : -1));
  // Reflejar en la UI: activar/desactivar los toggles de protección
  const item = el('perm-' + reportId);
  if (item) {
    item.classList.toggle('granted', on);
    const box = item.querySelector('.perm-opts');
    box.classList.toggle('disabled', !on);
    const o = mergeOpts(options[reportId]);
    box.querySelectorAll('input[data-optkey]').forEach(i => {
      i.disabled = !on;
      if (on) i.checked = !!o[i.dataset.optkey];
    });
    box.querySelectorAll('input[data-expiry]').forEach(i => { i.disabled = !on; });
  }
}

async function toggleOpt(userId, reportId, key, val) {
  await db.collection('userAccess').doc(userId)
    .set({ options: { [reportId]: { [key]: val } } }, { merge: true });
}

// Escribe (o borra) la fecha de caducidad del acceso por usuario + informe.
// Compartida por la pestaña Permisos y el modal de usuarios por informe.
async function writeExpiry(userId, reportId, value) {
  await db.collection('userAccess').doc(userId)

// Caducidad desde la pestaña Permisos (refresca esa vista para el botón de limpiar).
async function setExpiry(userId, reportId, value) {
  await writeExpiry(userId, reportId, value);
  loadUserPermissions();
}
function clearExpiry(userId, reportId, btn) {

/* ── USER VIEW ── */
async function loadUserReports() {
  const cont = el('user-reports-container');
  const accessSnap = await db.collection('userAccess').doc(currentUser.uid).get();
  const data = accessSnap.exists ? accessSnap.data() : {};
  const ids = data.reportIds || [];
  myAccessOptions = data.options || {};
  await loadFolders();   // el cliente también lee las carpetas para poder navegar
  if (!ids.length) {
    _userReports = []; _userVisibleFolderIds = new Set(); _userFolderId = null;
    cont.innerHTML = emptyHTML('📭', 'No tenés informes asignados aún.<br>Contactá al administrador.');
    return;
  }
  const reports = await Promise.all(
    ids.map(async id => { const d = await db.collection('reports').doc(id).get(); return d.exists ? {id,...d.data()} : null; })
  ).then(rs => rs.filter(Boolean));
  // Si el folderId apunta a una carpeta inexistente (p. ej. borrada), lo tratamos como raíz.
  reports.forEach(r => { if (r.folderId && !folderById(r.folderId)) r.folderId = null; });
  _userReports = reports;
  // Carpetas navegables por el cliente = las que están en el camino hacia algún
  // informe asignado Y están marcadas como visibles para clientes. Las carpetas
  // ocultas (clientVisible === false) se "saltean": su contenido se muestra en la
  // carpeta visible más cercana hacia arriba (o en la raíz). Esto es recursivo.
  const vis = new Set();
  reports.forEach(r => {
    let fid = r.folderId || null;
    const seen = new Set();
    while (fid && !seen.has(fid)) {
      seen.add(fid);
      const f = folderById(fid);
      if (f && isClientVisibleFolder(f)) vis.add(fid);   // solo carpetas visibles
      fid = f ? (f.parentId || null) : null;
    }
  });
  _userVisibleFolderIds = vis;
  _userFolderId = null;
  if (!reports.length) { cont.innerHTML = emptyHTML('📭', 'No hay informes disponibles.'); return; }
  renderUserLevel();
}

// Cuántos elementos ve el cliente directamente dentro de una carpeta: subcarpetas
// visibles + informes cuyo "padre visible más cercano" es esta carpeta (así se
// cuentan también los que provienen de subcarpetas ocultas promovidas a este nivel).
function countAccessibleInFolder(folderId) {
  const subs = [..._userVisibleFolderIds]
    .map(id => folderById(id))
    .filter(f => f && nearestVisibleFolderFrom(f.parentId || null) === folderId).length;
  const reps = _userReports
    .filter(r => nearestVisibleFolderFrom(r.folderId || null) === folderId).length;
  return subs + reps;
}

function userBreadcrumbHTML() {
  const chain = [];
  let cur = _userFolderId ? folderById(_userFolderId) : null;
  const seen = new Set();
  // Solo carpetas visibles: las ocultas no son navegables ni aparecen en la ruta.
  while (cur && !seen.has(cur.id)) { seen.add(cur.id); if (isClientVisibleFolder(cur)) chain.unshift(cur); cur = cur.parentId ? folderById(cur.parentId) : null; }
  let html = `<div class="breadcrumb"><a onclick="enterFolder(null)">🏠 Inicio</a>`;
  chain.forEach((f, i) => {
    html += `<span class="sep">›</span>`;
    html += (i === chain.length - 1)
      ? `<span class="current">📁 ${esc(f.name)}</span>`
      : `<a onclick="enterFolder('${f.id}')">📁 ${esc(f.name)}</a>`;
  });
  return html + `</div>`;
}

function enterFolder(id) { _userFolderId = id || null; renderUserLevel(); }

function renderUserLevel() {
  const cont = el('user-reports-container');
  const here = _userFolderId || null;
  // Subcarpetas visibles cuyo "padre visible más cercano" es este nivel (las que
  // cuelgan de carpetas ocultas se promueven hasta acá).
  const subfolders = [..._userVisibleFolderIds]
    .map(id => folderById(id))
    .filter(f => f && nearestVisibleFolderFrom(f.parentId || null) === here)
    .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'es'));
  // Informes cuyo "padre visible más cercano" es este nivel (incluye los que
  // estaban dentro de subcarpetas ocultas).
  const reportsHere = _userReports
    .filter(r => nearestVisibleFolderFrom(r.folderId || null) === here)
    .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'es'));

  // En la raíz sin ninguna carpeta, se ve igual que la grilla plana de antes.
  const crumbs = (here === null && !subfolders.length) ? '' : userBreadcrumbHTML();

  if (!subfolders.length && !reportsHere.length) {
    cont.innerHTML = crumbs + emptyHTML('📁', 'Esta carpeta está vacía.');
    return;
  }

  const folderCards = subfolders.map(f => {
    const n = countAccessibleInFolder(f.id);
    return `
    <div class="report-card" onclick="enterFolder('${f.id}')">
      <div class="report-card-icon">📁</div>
      <h3>${esc(f.name)}</h3>
      <div class="meta">${n} ${n === 1 ? 'elemento' : 'elementos'}</div>
    </div>`;
  }).join('');

  const reportCards = reportsHere.map(r => {
    if (accessExpired(myAccessOptions[r.id])) return `
    <div class="report-card expired" onclick="showAccessExpired()" title="Acceso caducado">
      <div class="report-card-icon">${fileIcon(r.name)}</div>
      <h3>${esc(r.name)}</h3>
      <div class="meta expired-meta">⛔ Acceso Caducado</div>
    </div>`;
    return `
    <div class="report-card" onclick="openUserReport('${r.storagePath}','${esc(r.name)}','${r.id}')">
      <div class="report-card-icon">${fileIcon(r.name)}</div>
      <h3>${esc(r.name)}</h3>
      <div class="meta">${fmtSize(r.size)} · ${fmtDate(r.createdAt)}</div>
    </div>`;
  }).join('');

  cont.innerHTML = crumbs + `<div class="report-grid">${folderCards}${reportCards}</div>`;
}

async function openUserReport(storagePath, name, reportId) {
  if (accessExpired(myAccessOptions[reportId])) { showAccessExpired(); return; }
  showLoadingOverlay(name);
  try {
    const url = await storage.ref(storagePath).getDownloadURL();
    const opts = mergeOpts(myAccessOptions[reportId]);
    await openViewer(url, name, opts, currentUser && currentUser.email, reportId);
  } catch (err) {
    alert('Error al cargar el informe: ' + (err.message || err));
  } finally {
    hideLoadingOverlay();
  }
}

/* ── Documentos subidos por el CLIENTE ── */
// Colección 'clientDocs' { name, storagePath, size, ext, ownerUid, ownerEmail, createdAt }.
// El cliente sube a clientDocs/{uid}/… y ve/borra solo los suyos; el admin ve/borra todos.
let myClientDocs = [];     // documentos del cliente actual (vista de usuario)
let allClientDocs = [];    // todos (vista admin)

function handleClientDragOver(e) { e.preventDefault(); el('client-upload-area').classList.add('drag'); }
function handleClientDragLeave() { el('client-upload-area').classList.remove('drag'); }
function handleClientDrop(e) {
  e.preventDefault(); el('client-upload-area').classList.remove('drag');
  const files = [...e.dataTransfer.files];
  if (files.length) uploadClientFiles(files);
}
function handleClientFileSelect(e) {
  if (e.target.files.length) uploadClientFiles([...e.target.files]);
  e.target.value = '';
}

async function uploadClientFiles(files) {
  // Se acepta cualquier tipo de archivo (los no previsualizables se descargan).
  if (!files.length) return;

  el('client-upload-progress').classList.remove('hidden');
  const bar = el('client-progress-bar');
  const statusEl = el('client-upload-status');

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    statusEl.textContent = `Subiendo ${i+1}/${files.length}: ${file.name}`;
    statusEl.style.color = '';
    el('client-upload-pct').textContent = '0%';
    bar.style.width = '0%'; bar.style.background = 'var(--orange)';

    const path = `clientDocs/${currentUser.uid}/${Date.now()}_${file.name}`;
    try {
      const task = storage.ref(path).put(file, { contentType: file.type || guessContentType(file.name) });
      await new Promise((res, rej) => {
        task.on('state_changed',
          s => {
            const pct = Math.round(s.bytesTransferred / s.totalBytes * 100);
            bar.style.width = pct + '%'; el('client-upload-pct').textContent = pct + '%';
          },
          err => { console.error('Client upload error:', err); rej(err); },
          async () => {
            try {
              await db.collection('clientDocs').add({
                name: file.name, storagePath: path, size: file.size, ext: extOf(file.name),
                ownerUid: currentUser.uid, ownerEmail: currentUser.email,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
              res();
            } catch (e) { console.error('Firestore write error:', e); rej(e); }
          }
        );
      });
    } catch (err) {
      bar.style.background = '#B83A26'; bar.style.width = '100%';
      let msg = '❌ Error al subir';
      if (err.code === 'storage/unauthorized')   msg = '❌ Sin permisos para subir — revisá las reglas de Storage';
      else if (err.code === 'permission-denied') msg = '❌ Firestore bloqueó la escritura';
      else if (err.code)                         msg = `❌ Error: ${err.code}`;
      else                                       msg = `❌ Error: ${err.message || 'desconocido'}`;
      statusEl.textContent = msg; statusEl.style.color = '#B83A26';
      alert(msg + '\n\nDetalle técnico (también en consola F12):\n' + (err.code || '') + '\n' + (err.message || err));
      return;
    }
  }
  statusEl.textContent = '✅ ¡Documento(s) subido(s) correctamente!';
  bar.style.width = '100%'; el('client-upload-pct').textContent = '100%';
  await loadMyClientDocs(); renderMyClientDocs();
  setTimeout(() => el('client-upload-progress').classList.add('hidden'), 3000);
}

async function loadMyClientDocs() {
  try {
    const snap = await db.collection('clientDocs').where('ownerUid', '==', currentUser.uid).get();
    myClientDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const ms = ts => (ts && ts.toMillis) ? ts.toMillis() : 0;
    myClientDocs.sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
  } catch { myClientDocs = []; }
}

function renderMyClientDocs() {
  const cont = el('client-docs-list'); if (!cont) return;
  const cnt = el('client-docs-count'); if (cnt) cnt.textContent = myClientDocs.length;
  if (!myClientDocs.length) { cont.innerHTML = emptyHTML('📤', 'Todavía no subiste documentos.'); return; }
  cont.innerHTML = `
    <table>
      <thead><tr><th>Nombre</th><th>Tamaño</th><th>Fecha</th><th>Acciones</th></tr></thead>
      <tbody>
        ${myClientDocs.map(d => `
        <tr>
          <td style="font-weight:600">${fileIcon(d.name)} ${esc(d.name)}</td>
          <td style="color:var(--gray)">${fmtSize(d.size)}</td>
          <td style="color:var(--gray)">${fmtDate(d.createdAt)}</td>
          <td><div class="td-actions">
            <button class="btn btn-outline btn-sm" onclick="previewReport('${d.storagePath}','${esc(d.name)}')">👁 Ver</button>
            <button class="btn btn-danger btn-sm" onclick="deleteMyClientDoc('${d.id}','${d.storagePath}')">🗑</button>
          </div></td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

async function deleteMyClientDoc(id, storagePath) {
  if (!confirm('¿Borrar este documento? Esta acción no se puede deshacer.')) return;
  try {
    try { await storage.ref(storagePath).delete(); } catch {}

    await loadMyClientDocs(); renderMyClientDocs();

async function loadClientDocs() {

          </div></td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

async function deleteClientDoc(id, storagePath) {
  if (!confirm('¿Borrar este documento subido por el cliente? Esta acción no se puede deshacer.')) return;

/* ── LOADING OVERLAY ── */
function showLoadingOverlay(fileName) {
  const ov = document.createElement('div');
  ov.className = 'loading-overlay';
  ov.id = 'loading-overlay';
  ov.innerHTML = `
    <div class="loading-box">
      <div class="accent-bar"></div>
      <h3>Cargando informe</h3>
      <div class="loading-file">📄 ${esc(fileName)}</div>
      <div class="progress"><div class="progress-bar-anim" id="loading-bar"></div></div>
      <div class="progress-pct" id="loading-pct">0%</div>
    </div>`;
  document.body.appendChild(ov);

  // Animación de progreso simulado: avanza rápido hasta 90% y se queda esperando
  const bar = document.getElementById('loading-bar');
  const pct = document.getElementById('loading-pct');
  let p = 0;
  const interval = setInterval(() => {
    p += (90 - p) * 0.08;
    if (p > 89.5) p = 89.5;
    bar.style.width = p + '%';
    pct.textContent = Math.round(p) + '%';
  }, 80);
  ov._interval = interval;
  return ov;
}

function hideLoadingOverlay() {
  const ov = document.getElementById('loading-overlay');
  if (!ov) return;
  clearInterval(ov._interval);
  const bar = document.getElementById('loading-bar');
  const pct = document.getElementById('loading-pct');
  if (bar) bar.style.width = '100%';
  if (pct) pct.textContent = '100%';
  setTimeout(() => ov.remove(), 250);
}

/* ══════════════════════════════════════
   VISOR — renderizado en el navegador (Opción A)
   Renderiza el documento dentro de la propia página para poder
   aplicar protecciones (marca de agua, bloqueo de impresión/descarga/copia).
   PDF → PDF.js · DOCX → docx-preview · PPTX → PPTXjs · HTML → iframe.
   Requiere CORS configurado en el bucket para leer los bytes (ver cors.json / README).
══════════════════════════════════════ */
let _viewerCleanup = null;

async function openViewer(url, name, opts, viewerEmail, reportId) {
  opts = mergeOpts(opts);
  const ext = extOf(name);
  const kind = fileKind(name);

  const vw = document.createElement('div');
  vw.className = 'viewer' + (opts.noCopy ? ' no-copy' : '');
  vw.id = 'viewer';
  if (opts.noCopy) { vw.oncontextmenu = () => false; vw.ondragstart = () => false; }

  const dlLink = opts.noDownload ? '' :
    `<a href="${url}" target="_blank" rel="noopener" class="btn btn-outline-dark btn-sm">↗ Abrir / Descargar</a>`;

  // En modo enlace público no hay "atrás": mostramos una etiqueta en su lugar.
  const backBtn = _publicMode
    ? `<span class="btn btn-outline-dark btn-sm" style="pointer-events:none;opacity:.75">🔗 Informe compartido</span>`
    : `<button class="btn btn-outline-dark btn-sm" onclick="closeViewer()">← Volver</button>`;

  vw.innerHTML = `
    <div class="viewer-bar">
      ${backBtn}
      <div class="viewer-title">${fileIcon(name)} ${esc(name)}</div>
      ${dlLink}
    </div>
    <div class="viewer-content" id="viewer-content">
      <div class="loading" style="padding:2.5rem;text-align:center">Preparando vista…</div>
    </div>`;
  document.body.appendChild(vw);

  setupProtections(vw, opts, viewerEmail);
  const content = vw.querySelector('#viewer-content');

  try {
    if (kind === 'html') {
      content.innerHTML = `<iframe class="viewer-frame" src="${url}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>`;
      const ifr = content.querySelector('iframe');
      setupDashboardAnalytics(ifr, reportId, name);
      setupPortalParams(ifr);
    } else if (kind === 'video') {
      renderVideo(url, content, opts);
    } else if (ext === 'pdf') {
      await renderPdf(url, content);
    } else if (ext === 'docx') {
      await renderDocx(url, content);
    } else if (ext === 'pptx') {
      await renderPptx(url, content);
    } else if (kind === 'download') {
      // Formato sin visor: se ofrece la descarga (respetando "bloquear descarga").
      content.innerHTML = downloadOnlyView(name, opts);
      const btn = content.querySelector('#viewer-dl-btn');
      if (btn) btn.onclick = () => downloadBlobUrl(url, name);
    } else {
      content.innerHTML = legacyFallback(name, url, opts);  // .doc / .ppt antiguos
    }
  } catch (err) {
    console.error('Error al renderizar el documento:', err);
    content.innerHTML = renderErrorHTML(err, url, opts);
  }
}

function closeViewer() {
  teardownProtections();
  const v = document.getElementById('viewer');
  if (v) v.remove();
}

// Recibe los eventos de analítica que el dashboard (iframe) manda por postMessage
// y los guarda en Firestore, atados al usuario / sesión / informe.
// Solo se activa en vistas de cliente (reportId presente); la vista previa del admin no registra.
function setupDashboardAnalytics(iframe, reportId, name) {
  if (!reportId || !iframe || !currentUser) return;
  const handler = (e) => {
    const d = e.data;
    if (!d || d.__portalAnalytics !== true) return;
    if (e.source !== iframe.contentWindow) return;   // solo mensajes de ESTE iframe
    if (d.event !== 'open' && d.event !== 'tab') return;
    db.collection('dashboardEvents').add({
      uid: currentUser.uid,
      email: currentUser.email,
      reportId: reportId,
      reportName: name,
      sessionId: currentSessionId || null,
      event: d.event,
      section: d.section || null,
      dwellMs: (typeof d.dwellMs === 'number' && isFinite(d.dwellMs)) ? Math.max(0, Math.round(d.dwellMs)) : null,
      at: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(() => {});
  };
  window.addEventListener('message', handler);
  const prev = _viewerCleanup;   // encadenar al cierre del visor para remover el listener
  _viewerCleanup = () => { if (prev) prev(); window.removeEventListener('message', handler); };
}

// Envía al informe (iframe) los parámetros del usuario cuando este los pide.
// El HTML debe pedirlos con: parent.postMessage({ __portalParamsRequest: true }, '*')
// y escuchar la respuesta { __portalParams:true, email, uid, params }.
function setupPortalParams(iframe) {
  if (!iframe) return;
  const handler = (e) => {
    const d = e.data;
    if (!d || d.__portalParamsRequest !== true) return;
    if (e.source !== iframe.contentWindow) return;   // solo mensajes de ESTE iframe
    const payload = {
      __portalParams: true,
      email: currentUser ? currentUser.email : null,
      uid: currentUser ? currentUser.uid : null,
      params: (currentUserData && currentUserData.params) || {}
    };
    try { iframe.contentWindow.postMessage(payload, '*'); } catch (err) {}
  };
  window.addEventListener('message', handler);
  const prev = _viewerCleanup;
  _viewerCleanup = () => { if (prev) prev(); window.removeEventListener('message', handler); };
}

/* ── Protecciones (marca de agua, impresión, copia) ── */
function setupProtections(vw, opts, email) {
  teardownProtections();
  if (opts.watermark) addWatermark(vw, email);
  if (opts.noPrint) {
    document.body.classList.add('no-print-active');
    window.addEventListener('keydown', blockPrintKey, true);
  }
  _viewerCleanup = () => {
    document.body.classList.remove('no-print-active');
    window.removeEventListener('keydown', blockPrintKey, true);
  };
}
function teardownProtections() { if (_viewerCleanup) { _viewerCleanup(); _viewerCleanup = null; } }
function blockPrintKey(e) {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
    e.preventDefault(); e.stopPropagation(); return false;
  }
}
function addWatermark(vw, email) {
  const now = new Date();
  const stamp = `${email || ''} · ${now.toLocaleDateString('es-UY')} ${now.toLocaleTimeString('es-UY',{hour:'2-digit',minute:'2-digit'})}`;
  const t = stamp.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='360' height='220'>` +
    `<text x='180' y='110' transform='rotate(-28 180 110)' fill='rgba(20,20,20,0.13)' ` +
    `font-size='15' font-family='Arial,sans-serif' text-anchor='middle'>${t}</text></svg>`;
  const ov = document.createElement('div');
  ov.className = 'wm-overlay';
  ov.style.backgroundImage = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
  ov.style.backgroundRepeat = 'repeat';
  vw.appendChild(ov);
}

/* ── Renderizadores (librerías cargadas on-demand por CDN) ── */
async function fetchBytes(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.arrayBuffer();
}
function renderVideo(url, content, opts) {
  // Reproducción nativa e inline. Sin librerías ni CORS (como el iframe).
  // Con descarga bloqueada: se oculta el botón de descarga de los controles y
  // el clic derecho (a nivel del visor). Es disuasivo, no infalible.
  const noDl = opts && opts.noDownload
    ? ' controlsList="nodownload noremoteplayback" disablepictureinpicture oncontextmenu="return false"'
    : '';
  content.innerHTML = `<div class="video-wrap">
    <video class="viewer-video" src="${url}" controls playsinline preload="metadata"${noDl}>
      Tu navegador no puede reproducir este video.
    </video>
  </div>`;
}
async function renderPdf(url, content) {
  await loadScript(LIB.pdf);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
  const data = await fetchBytes(url);
  const pdf = await window.pdfjsLib.getDocument({ data }).promise;
  content.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'pdf-pages'; content.appendChild(wrap);
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    canvas.className = 'pdf-page';
    canvas.width = viewport.width; canvas.height = viewport.height;
    wrap.appendChild(canvas);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  }
}
async function renderDocx(url, content) {
  await useJSZip(LIB.jszip3, '__jszip3');   // docx-preview requiere JSZip 3.x
  await loadScript(LIB.docx);
  window.JSZip = window.__jszip3;            // asegurar 3.x al renderizar
  const data = await fetchBytes(url);
  content.innerHTML = '';
  const target = document.createElement('div'); target.className = 'docx-wrap'; content.appendChild(target);
  await window.docx.renderAsync(data, target);
}
async function renderPptx(url, content) {
  // El orden importa: PPTXjs depende de jQuery, JSZip (2.x), JSZipUtils, FileReaderJS y (para gráficos) d3 + nv.d3.
  await loadScript(LIB.jquery);
  await useJSZip(LIB.jszip2, '__jszip2');    // PPTXjs usa la API de JSZip 2.x (new JSZip / .load)
  await loadScript(LIB.jsziputils);
  await loadScript(LIB.filereader);
  await loadScript(LIB.d3);
  await loadScript(LIB.nvd3);
  loadCss(LIB.pptxCss);

  await loadScript(LIB.pptxjs);

  window.JSZip = window.__jszip2;            // asegurar 2.x justo antes de renderizar
  content.innerHTML = '<div id="pptx-result" class="pptx-wrap"></div>';
  // PPTXjs renderiza de forma asíncrona (no devuelve promesa); las diapositivas aparecen a medida que procesa.
  window.jQuery('#pptx-result').pptxToHtml({ pptxFileUrl: url, slideMode: false, keyBoardShortCut: false });
}
